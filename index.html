  <style>
    :root {
      --bg:            #1a1614;
      --surface:       #221d1a;
      --surface-2:     #2a2421;
      --text:          #f0ebe5;
      --text-dim:      #a89e94;
      --text-muted:    #6b6259;
      --border:        rgba(240,235,229,0.07);
      --border-strong: rgba(240,235,229,0.12);
      --accent:        #D97757;
      --accent-soft:   #2e1f1a;
      --accent-dim:    rgba(217,119,87,0.16);
      --success:       #7fa67a;
      --sans:  'Geist', -apple-system, system-ui, sans-serif;
      --mono:  'Geist Mono', ui-monospace, monospace;
      --serif: 'Instrument Serif', Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; background: #0e0b0a; color: var(--text);
      font-family: var(--sans); -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%; overscroll-behavior: none;
    }
    body {
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(217,119,87,0.06), transparent 60%),
        radial-gradient(900px 500px at 80% 100%, rgba(217,119,87,0.04), transparent 60%),
        #0e0b0a;
    }
    #root { display: flex; justify-content: center; min-height: 100dvh; }
    .app {
      width: 100%; max-width: 430px; min-height: 100dvh;
      background: var(--bg); display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
    input, textarea, button, select { font-family: var(--sans); }

    /* modal backdrop */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px); z-index: 100;
      display: flex; align-items: flex-end; justify-content: center;
      animation: fade-in 200ms ease both;
    }
    .modal-sheet {
      width: 100%; max-width: 430px; background: var(--surface);
      border-radius: 24px 24px 0 0; padding: 0 0 40px;
      border-top: 1px solid var(--border-strong);
      animation: slide-up 300ms cubic-bezier(.2,.7,.2,1) both;
      max-height: 85dvh; overflow-y: auto;
    }
    .modal-handle {
      width: 36px; height: 4px; background: var(--border-strong);
      border-radius: 999px; margin: 14px auto 20px;
    }

    @keyframes pulse-ring { 0% { transform:scale(.9); opacity:.9; } 80%,100% { transform:scale(1.4); opacity:0; } }
    @keyframes float-up   { from { transform:translateY(8px); opacity:0; } to { transform:translateY(0); opacity:1; } }
    @keyframes fade-in    { from { opacity:0; } to { opacity:1; } }
    @keyframes scale-in   { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
    @keyframes slide-up   { from { transform:translateY(100%); } to { transform:translateY(0); } }
    @keyframes lift       { 0%,100% { transform:translateY(0) rotate(-4deg); } 50% { transform:translateY(-6px) rotate(4deg); } }
  </style>
</head>

   STORAGE — everything goes through here
═══════════════════════════════════════════════════════════════ */
const S = {
  get:  (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set:  (k, v)   => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },

  getUser:       ()  => S.get('pulso_user', null),
  setUser:       (u) => S.set('pulso_user', u),

  getPlan:       ()  => S.get('pulso_plan', DEFAULT_PLAN),
  setPlan:       (p) => S.set('pulso_plan', p),

  getWeights:    ()  => S.get('pulso_weights', {}),
  setWeights:    (w) => S.set('pulso_weights', w),

  getSessions:   ()  => S.get('pulso_sessions', []),
  addSession:    (s) => { const arr = S.getSessions(); arr.unshift(s); S.set('pulso_sessions', arr.slice(0, 120)); },

  getBodyLog:    ()  => S.get('pulso_bodylog', []),
  addBodyEntry:  (e) => { const arr = S.getBodyLog(); arr.push(e); arr.sort((a,b)=>a.date.localeCompare(b.date)); S.set('pulso_bodylog', arr); },

  getMeals:      ()  => S.get('pulso_meals', {}),
  setMeals:      (m) => S.set('pulso_meals', m),

  getMealPlan:   ()  => S.get('pulso_meal_plan', DEFAULT_MEAL_PLAN),
  setMealPlan:   (p) => S.set('pulso_meal_plan', p),
};

function Screen({ children, padBottom=110, style={} }) {
  return (
    <div style={{ flex:1, overflowY:'auto', overflowX:'hidden', padding:`56px 20px ${padBottom}px`, animation:'fade-in 260ms ease both', WebkitOverflowScrolling:'touch', ...style }}>
      {children}

  );
}

function Btn({ children, variant='primary', size='md', icon, onClick, style={}, disabled }) {
  const sz = { sm:{fontSize:13,padding:'8px 14px',borderRadius:10,height:34}, md:{fontSize:15,padding:'12px 18px',borderRadius:14,height:46}, lg:{fontSize:16,padding:'16px 22px',borderRadius:18,height:56} }[size];
  const va = { primary:{background:'var(--accent)',color:'#1a0f0a'}, soft:{background:'var(--accent-soft)',color:'var(--accent)'}, ghost:{background:'transparent',color:'var(--text)',border:'1px solid var(--border-strong)'}, danger:{background:'rgba(196,102,94,.16)',color:'#c4665e'}, dark:{background:'var(--surface-2)',color:'var(--text)'} }[variant];
  return (
    <button onClick={onClick} disabled={disabled}
      onTouchStart={e=>e.currentTarget.style.transform='scale(0.97)'}
      onTouchEnd={e=>e.currentTarget.style.transform=''}
      onMouseDown={e=>e.currentTarget.style.transform='scale(0.97)'}
      onMouseUp={e=>e.currentTarget.style.transform=''}
      onMouseLeave={e=>e.currentTarget.style.transform=''}
      style={{ border:'none', fontFamily:'var(--sans)', fontWeight:500, display:'inline-flex', alignItems:'center', justifyContent:'center', gap:8, transition:'transform 100ms', opacity:disabled?.45:1, cursor:disabled?'not-allowed':'pointer', ...sz, ...va, ...style }}>
      {icon}{children}
    </button>
  );
}

function Card({ children, style={}, onClick, accent=false }) {
  return (
    <div onClick={onClick} style={{ background:accent?'linear-gradient(160deg,rgba(217,119,87,.10),rgba(217,119,87,.02) 60%) var(--surface)':'var(--surface)', border:'1px solid var(--border)', borderRadius:20, cursor:onClick?'pointer':'default', ...style }}>

function TabBar({ tabs, active, onChange }) {
  return (
    <div style={{ position:'absolute', left:0, right:0, bottom:0, paddingBottom:'max(20px,env(safe-area-inset-bottom,0px))', paddingTop:10, paddingLeft:14, paddingRight:14, background:'linear-gradient(180deg,transparent,rgba(14,11,10,.95) 50%)', backdropFilter:'blur(20px)', WebkitBackdropFilter:'blur(20px)', zIndex:40 }}>
      <div style={{ display:'flex', background:'rgba(34,29,26,0.72)', border:'1px solid var(--border-strong)', borderRadius:22, padding:6 }}>
        {tabs.map(t=>{
          const on = t.id===active;
          return (
            <button key={t.id} onClick={()=>onChange(t.id)} style={{ flex:1, border:'none', padding:'10px 6px', borderRadius:16, background:on?'var(--accent)':'transparent', color:on?'#1a0f0a':'var(--text-dim)', display:'flex', flexDirection:'column', alignItems:'center', gap:4, transition:'background 200ms, color 200ms', fontFamily:'var(--sans)', fontSize:10.5, fontWeight:500 }}>

            </button>
          );
        })}
      </div>
    </div>
  );
}

function CircleProg({ value, max=100, size=120, stroke=10, color='var(--accent)', children }) {
  const r=(size-stroke)/2, c=2*Math.PI*r, pct=Math.max(0,Math.min(1,value/max));
  const [a,setA]=useState(0);
  useEffect(()=>{ const t=setTimeout(()=>setA(pct),120); return()=>clearTimeout(t); },[pct]);
  return (
    <div style={{ position:'relative', width:size, height:size, display:'inline-flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
      <svg width={size} height={size} style={{ transform:'rotate(-90deg)', position:'absolute' }}>
        <circle cx={size/2} cy={size/2} r={r} stroke="rgba(217,119,87,.12)" strokeWidth={stroke} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c*(1-a)} style={{ transition:'stroke-dashoffset 900ms cubic-bezier(.2,.7,.2,1)' }}/>
      </svg>
      <div style={{ position:'relative', textAlign:'center', lineHeight:1.1 }}>{children}</div>
    </div>
  );
}

function SmoothChart({ data, height=120 }) {
  const ref = useRef(null);
  const [w, setW] = useState(300);
  useEffect(()=>{ if(ref.current) setW(ref.current.offsetWidth); },[]);
  if (!data || data.length < 2) return <div ref={ref} style={{height}} />;

  const ys = data.map(d=>d.v), minY=Math.min(...ys), maxY=Math.max(...ys), rng=(maxY-minY)||1;
  const pad=14, ypad=rng*.25, lo=minY-ypad, hi=maxY+ypad;
  const W=w-pad*2, H=height-pad*2;
  const px=i=>pad+(W*i)/(ys.length-1), py=v=>pad+H-((v-lo)/(hi-lo))*H;
  const pts=ys.map((y,i)=>[px(i),py(y)]);
  let d=`M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const [x0]=pts[Math.max(0,i-1)], [,y0]=pts[Math.max(0,i-1)];
    const [x1,y1]=pts[i], [x2,y2]=pts[i+1], [x3,y3]=pts[Math.min(pts.length-1,i+2)];
    const t=.22;
    d+=` C ${x1+(x2-x0)*t} ${y1+(y2-y0)*t}, ${x2-(x3-x1)*t} ${y2-(y3-y1)*t}, ${x2} ${y2}`;
  }
  const area=`${d} L ${pts[pts.length-1][0]} ${height-pad} L ${pts[0][0]} ${height-pad} Z`;
  return (
    <div ref={ref} style={{height, overflow:'hidden'}}>
      <svg width={w} height={height} style={{display:'block'}}>
        <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="rgba(217,119,87,.35)"/><stop offset="100%" stopColor="rgba(217,119,87,0)"/></linearGradient></defs>
        <path d={area} fill="url(#g1)"/>
        <path d={d} stroke="var(--accent)" strokeWidth={2.4} fill="none" strokeLinecap="round"/>
        {pts.map(([x,y],i)=><circle key={i} cx={x} cy={y} r={i===pts.length-1?4.5:2.4} fill={i===pts.length-1?'var(--accent)':'var(--bg)'} stroke="var(--accent)" strokeWidth={i===pts.length-1?2:1.4}/>)}
      </svg>
    </div>
  );
}

function Onboarding({ onFinish }) {
  const [step, setStep] = useState(-1);
  const [user, setUser] = useState({ name:'', goal:null, level:null, freq:null, place:null, duration:null, notes:'' });
  const q = ONBOARDING_QS[step];
  const totalQ = ONBOARDING_QS.length;
  const next = () => setStep(s=>s+1);
  const back = () => setStep(s=>Math.max(-1,s-1));
  const set  = (id,v) => setUser(u=>({...u,[id]:v}));

  if (step===-1) return <OnbWelcome onStart={next}/>;
  if (step===totalQ) return <OnbSummary user={user} onFinish={()=>{ S.setUser(user); onFinish(user); }} onBack={back}/>;

  const canNext = q.optional ? true : q.kind==='text' ? (user[q.id]||'').trim().length>0 : q.kind==='longtext' ? true : user[q.id]!=null;

  return (
    <div style={{ position:'relative', height:'100%', display:'flex', flexDirection:'column' }}>
      <div style={{ height:56 }}/>
      <div style={{ padding:'6px 22px 20px', display:'flex', alignItems:'center', gap:12 }}>
        <button onClick={back} style={{ width:34, height:34, borderRadius:999, background:'var(--surface)', border:'1px solid var(--border)', color:'var(--text-dim)', display:'flex', alignItems:'center', justifyContent:'center' }}><I.ChevL sz={18} st={1.8}/></button>
        <div style={{ flex:1, display:'flex', gap:5 }}>
          {ONBOARDING_QS.map((_,i)=><div key={i} style={{ flex:1, height:4, borderRadius:999, background:i<=step?'var(--accent)':'var(--surface-2)', transition:'background 280ms' }}/>)}
        </div>
        <div style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--text-muted)', minWidth:28, textAlign:'right' }}>{step+1}/{totalQ}</div>
      </div>
      <div key={step} style={{ flex:1, overflowY:'auto', padding:'8px 22px 24px', animation:'float-up 360ms cubic-bezier(.2,.7,.2,1) both' }}>
        <div style={{ fontSize:27, fontWeight:500, letterSpacing:'-0.025em', lineHeight:1.15, marginBottom:8 }}>{q.title}</div>
        {q.subtitle && <div style={{ color:'var(--text-dim)', fontSize:14.5, lineHeight:1.45, marginBottom:24 }}>{q.subtitle}</div>}
        {q.kind==='text' && <OField value={user[q.id]} onChange={v=>set(q.id,v)} placeholder={q.placeholder} autoFocus/>}
        {q.kind==='longtext' && <OArea value={user[q.id]} onChange={v=>set(q.id,v)} placeholder={q.placeholder}/>}
        {q.kind==='choice' && <ChoiceList options={q.options} value={user[q.id]} onChange={v=>{ set(q.id,v); if(!q.allowOther) setTimeout(next,180); }} allowOther={q.allowOther}/>}
      </div>
      <div style={{ padding:'12px 22px 36px', background:'linear-gradient(180deg,transparent,var(--bg) 50%)' }}>
        <Btn size="lg" onClick={next} disabled={!canNext} style={{ width:'100%' }}>{step===totalQ-1?'Listo':'Continuar'} <I.ChevR sz={18}/></Btn>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   TRAINING MODE
═══════════════════════════════════════════════════════════════ */
function TrainingMode({ routine, onExit, onSave }) {
  const savedWeights = S.getWeights();
  const [exIdx,  setExIdx]  = useState(0);
  const [done,   setDone]   = useState({});
  const [wts,    setWts]    = useState(()=>Object.fromEntries(routine.map(e=>[e.id, savedWeights[e.id]??e.defaultWeight])));
  const [timer,  setTimer]  = useState(null);
  const [elapsed,setEl]     = useState(0);
  const [fin,    setFin]    = useState(false);

  const ex = routine[exIdx];
  const doneThis = done[ex.id]||0;
  const totalEx  = routine.length;
  const overDone  = routine.reduce((a,e)=>a+(done[e.id]||0),0);
  const overTotal = routine.reduce((a,e)=>a+e.sets,0);

  useEffect(()=>{ const t=setInterval(()=>setEl(s=>s+1),1000); return()=>clearInterval(t); },[]);
  useEffect(()=>{
    if(!timer||timer.left<=0) return;
    const t=setTimeout(()=>setTimer(tm=>tm?{...tm,left:tm.left-1}:null),1000);
    return()=>clearTimeout(t);
  },[timer]);

  const completeSet=()=>{
    if(doneThis>=ex.sets) return;
    setDone(d=>({...d,[ex.id]:(d[ex.id]||0)+1}));
    setTimer({ left:ex.restSec, total:ex.restSec });
  };
  const next=()=>{ exIdx<totalEx-1?(setExIdx(i=>i+1),setTimer(null)):setFin(true); };
  const prev=()=>{ if(exIdx>0){setExIdx(i=>i-1);setTimer(null);} };
  const adj=(d)=>setWts(w=>({...w,[ex.id]:Math.max(0,+((w[ex.id]||0)+d).toFixed(2))}));

  const handleFinish=()=>{
    const session={ id:uid(), date:today(), duration:elapsed, exercises:routine.map(e=>({ id:e.id, name:e.name, sets:done[e.id]||0, weight:wts[e.id] })) };
    onSave(wts, session);
  };

  if (fin) return <TrainingDone elapsed={elapsed} done={overDone} total={overTotal} onFinish={handleFinish}/>;

  return (
    <div style={{ position:'relative', height:'100%', background:'var(--bg)', display:'flex', flexDirection:'column' }}>
      <div style={{ height:56 }}/>
      <div style={{ padding:'4px 20px 10px', display:'flex', alignItems:'center', gap:10 }}>
        <button onClick={onExit} style={{ width:34, height:34, borderRadius:999, background:'var(--surface)', border:'1px solid var(--border)', color:'var(--text-dim)', display:'flex', alignItems:'center', justifyContent:'center' }}><I.X sz={16} st={2}/></button>
        <div style={{ flex:1, textAlign:'center' }}>
          <div style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--text-muted)', letterSpacing:'0.14em', textTransform:'uppercase' }}>Entrenando</div>
          <div style={{ fontFamily:'var(--mono)', fontSize:14, color:'var(--text)', marginTop:2 }}>{fmtSecs(elapsed)}</div>
        </div>
        <div style={{ width:34, height:34, borderRadius:999, background:'var(--surface)', border:'1px solid var(--border)', display:'flex', alignItems:'center', justifyContent:'center' }}>
          <I.More sz={16} color="var(--text-dim)"/>
        </div>
      </div>

      <div style={{ padding:'0 20px 14px' }}>
        <div style={{ display:'flex', gap:4 }}>
          {routine.map((e,i)=>(
            <div key={e.id} style={{ flex:1, height:3, borderRadius:999, background:i<exIdx?'var(--accent)':i===exIdx?'var(--accent-dim)':'var(--surface-2)', position:'relative', overflow:'hidden' }}>
              {i===exIdx&&<div style={{ position:'absolute', left:0, top:0, bottom:0, width:`${(doneThis/ex.sets)*100}%`, background:'var(--accent)', transition:'width 320ms ease' }}/>}
            </div>
          ))}
        </div>
        <div style={{ display:'flex', justifyContent:'space-between', marginTop:8, fontSize:11, color:'var(--text-muted)' }}>
          <span style={{ fontFamily:'var(--mono)' }}>{String(exIdx+1).padStart(2,'0')} / {String(totalEx).padStart(2,'0')}</span>
          <span style={{ fontFamily:'var(--mono)' }}>{overDone}/{overTotal} series</span>
        </div>
      </div>

      <div key={ex.id} style={{ flex:1, overflowY:'auto', padding:'0 20px 24px', animation:'fade-in 260ms ease both', WebkitOverflowScrolling:'touch' }}>
        <div style={{ fontSize:13, color:'var(--text-dim)' }}>{ex.muscle}</div>
        <div style={{ fontFamily:'var(--serif)', fontStyle:'italic', fontSize:34, lineHeight:1.05, marginTop:6, letterSpacing:'-0.02em' }}>{ex.name}</div>

        <div style={{ marginTop:22, display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          <div style={{ padding:18, borderRadius:20, background:'var(--surface)', border:'1px solid var(--border)' }}>
            <div style={{ fontSize:11, color:'var(--text-muted)', letterSpacing:'0.08em', textTransform:'uppercase' }}>Peso</div>
            <div style={{ marginTop:6, display:'flex', alignItems:'baseline' }}>
              <div style={{ fontFamily:'var(--mono)', fontSize:38, fontWeight:500, letterSpacing:'-0.02em' }}>{wts[ex.id]}</div>
              <div style={{ marginLeft:4, fontSize:13, color:'var(--text-muted)' }}>kg</div>
            </div>
            <div style={{ display:'flex', gap:5, marginTop:12 }}>
              {[[-2.5,'−2.5'],[-1.25,'−1.25'],[1.25,'+1.25'],[2.5,'+2.5']].map(([d,l])=>(
                <button key={l} onClick={()=>adj(d)} style={{ flex:1, padding:'6px 0', borderRadius:8, border:'none', background:d>0?'var(--accent-dim)':'var(--surface-2)', color:d>0?'var(--accent)':'var(--text-dim)', fontFamily:'var(--mono)', fontSize:10, fontWeight:500, cursor:'pointer' }}>{l}</button>
              ))}
            </div>
          </div>
          <div style={{ padding:18, borderRadius:20, background:'var(--surface)', border:'1px solid var(--border)' }}>
            <div style={{ fontSize:11, color:'var(--text-muted)', letterSpacing:'0.08em', textTransform:'uppercase' }}>Reps</div>
            <div style={{ marginTop:6, fontFamily:'var(--mono)', fontSize:38, fontWeight:500, letterSpacing:'-0.02em' }}>{ex.reps}</div>
            <div style={{ marginTop:12, fontSize:12, color:'var(--text-dim)', lineHeight:1.4 }}>descanso {ex.restSec}s</div>
          </div>
        </div>

        <div style={{ marginTop:20 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:10 }}>
            <div style={{ fontSize:12, color:'var(--text-dim)', fontFamily:'var(--mono)', letterSpacing:'0.08em', textTransform:'uppercase' }}>Series</div>
            <div style={{ fontFamily:'var(--mono)', fontSize:13 }}>{doneThis}/{ex.sets}</div>
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
            {Array.from({length:ex.sets}).map((_,i)=>{
              const isDone=i<doneThis, isCurr=i===doneThis;
              return (
                <div key={i} style={{ display:'flex', alignItems:'center', gap:12, padding:'12px 14px', borderRadius:12, background:isCurr?'var(--accent-dim)':isDone?'rgba(127,166,122,.07)':'var(--surface)', border:`1px solid ${isCurr?'var(--accent)':isDone?'rgba(127,166,122,.18)':'var(--border)'}`, transition:'all 200ms' }}>
                  <div style={{ width:26, height:26, borderRadius:999, background:isDone?'var(--success)':isCurr?'var(--accent)':'var(--surface-2)', color:(isDone||isCurr)?'#0e0b0a':'var(--text-muted)', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'var(--mono)', fontSize:12, fontWeight:600 }}>
                    {isDone?<I.Check sz={14} st={2.4}/>:i+1}
                  </div>
                  <div style={{ flex:1, fontSize:13, color:isDone?'var(--text-dim)':'var(--text)' }}>
                    {isDone?`${wts[ex.id]} kg · ${ex.reps} reps`:isCurr?'Serie actual':`${wts[ex.id]} kg · ${ex.reps} reps`}
                  </div>
                  {isDone&&<span style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--text-muted)' }}>✓</span>}
                </div>
              );
            })}
          </div>
        </div>
        <div style={{ height:90 }}/>
      </div>

      <div style={{ padding:'12px 20px 28px', background:'linear-gradient(180deg,transparent,var(--bg) 40%)', display:'flex', gap:8 }}>
        <button onClick={prev} disabled={exIdx===0} style={{ width:56, height:56, borderRadius:18, background:'var(--surface)', border:'1px solid var(--border)', color:'var(--text-dim)', display:'flex', alignItems:'center', justifyContent:'center', opacity:exIdx===0?.4:1, cursor:exIdx===0?'not-allowed':'pointer' }}><I.ChevL sz={20} st={2}/></button>
        {doneThis<ex.sets
          ? <Btn size="lg" onClick={completeSet} icon={<I.Check sz={18} st={2.2}/>} style={{ flex:1 }}>Serie hecha</Btn>
          : <Btn size="lg" onClick={next} icon={<I.ChevR sz={18}/>} style={{ flex:1 }}>{exIdx<totalEx-1?'Siguiente':'Terminar'}</Btn>}
        <button onClick={next} style={{ width:56, height:56, borderRadius:18, background:'var(--surface)', border:'1px solid var(--border)', color:'var(--text-dim)', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer' }}><I.ChevR sz={20} st={2}/></button>
      </div>

      {timer&&timer.left>0&&<RestTimer timer={timer} onSkip={()=>setTimer(null)} onAdd={s=>setTimer(t=>t?{...t,left:t.left+s,total:t.total+s}:null)}/>}
    </div>
  );
}

function RestTimer({ timer, onSkip, onAdd }) {
  const m=Math.floor(timer.left/60), s=timer.left%60;
  return (
    <div style={{ position:'absolute', left:14, right:14, bottom:108, background:'rgba(34,29,26,.94)', backdropFilter:'blur(16px)', WebkitBackdropFilter:'blur(16px)', border:'1px solid rgba(217,119,87,.35)', borderRadius:22, padding:'14px 18px', display:'flex', alignItems:'center', gap:14, boxShadow:'0 20px 50px rgba(0,0,0,.5)', animation:'scale-in 320ms cubic-bezier(.2,.7,.2,1) both', zIndex:50 }}>
      <CircleProg size={60} stroke={5} value={1-timer.left/timer.total} max={1}>
        <div style={{ fontFamily:'var(--mono)', fontSize:15, fontWeight:500 }}>{String(m).padStart(2,'0')}:{String(s).padStart(2,'0')}</div>
      </CircleProg>
      <div style={{ flex:1 }}>
        <div style={{ fontSize:11, color:'var(--accent)', fontFamily:'var(--mono)', letterSpacing:'0.08em', textTransform:'uppercase' }}>Descanso</div>
        <div style={{ marginTop:2, fontSize:14, color:'var(--text)' }}>Preparate para la siguiente.</div>
      </div>
      <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
        <button onClick={()=>onAdd(15)} style={{ padding:'5px 10px', borderRadius:10, background:'var(--surface-2)', border:'none', color:'var(--text-dim)', fontFamily:'var(--mono)', fontSize:11, cursor:'pointer' }}>+15s</button>
        <button onClick={onSkip} style={{ padding:'5px 10px', borderRadius:10, background:'var(--accent)', border:'none', color:'#1a0f0a', fontFamily:'var(--sans)', fontSize:11, fontWeight:500, cursor:'pointer' }}>Saltar</button>
      </div>
    </div>
  );
}

function TrainingDone({ elapsed, done, total, onFinish }) {
  return (
    <div style={{ position:'absolute', inset:0, background:'var(--bg)', display:'flex', flexDirection:'column', justifyContent:'space-between', padding:'90px 24px 48px' }}>
      <div style={{ animation:'float-up 600ms cubic-bezier(.2,.7,.2,1) both' }}>
        <div style={{ position:'relative', width:96, height:96, marginBottom:24 }}>
          <div style={{ position:'absolute', inset:0, borderRadius:999, background:'var(--accent-dim)', animation:'pulse-ring 2.4s ease-out infinite' }}/>
          <div style={{ position:'absolute', inset:0, borderRadius:999, background:'linear-gradient(160deg,var(--accent),#b85a3e)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:50, boxShadow:'0 12px 40px rgba(217,119,87,.35)' }}>🎉</div>
        </div>
        <div style={{ fontFamily:'var(--serif)', fontStyle:'italic', fontSize:38, lineHeight:1.05, letterSpacing:'-0.02em', marginBottom:10 }}>Bien hecho.</div>
        <div style={{ color:'var(--text-dim)', fontSize:15, lineHeight:1.5, marginBottom:24 }}>Sesión guardada. Los pesos quedan registrados para la próxima.</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          {[['Tiempo',fmtSecs(elapsed),true],['Series',`${done}/${total}`,true],['kcal aprox.','~ '+(Math.round(elapsed/60*6.5)),true],['Guardado','✓',false]].map(([l,v,m])=>(
            <div key={l} style={{ padding:'14px 16px', borderRadius:16, background:'var(--surface)', border:'1px solid var(--border)' }}>
              <div style={{ fontSize:11, color:'var(--text-muted)', letterSpacing:'0.08em', textTransform:'uppercase' }}>{l}</div>
              <div style={{ marginTop:6, fontSize:22, fontWeight:500, fontFamily:m?'var(--mono)':'var(--sans)', letterSpacing:'-0.01em' }}>{v}</div>
            </div>
          ))}
        </div>
      </div>
      <Btn size="lg" onClick={onFinish} style={{ width:'100%' }}>Cerrar sesión</Btn>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   ALIMENTACIÓN TAB
═══════════════════════════════════════════════════════════════ */
function AlimentacionTab() {
  const todayKey = today();
  const [mealPlan,  setMealPlan_] = useState(()=>S.getMealPlan());
  const [selected,  setSelected]  = useState(()=>S.getMeals()[todayKey]||{});
  const [openBlock, setOpenBlock] = useState(null);
  const [editMode,  setEditMode]  = useState(false);

  const saveMealPlan = (p) => { setMealPlan_(p); S.setMealPlan(p); };
  const saveSel      = (ns) => { setSelected(ns); S.setMeals({...S.getMeals(),[todayKey]:ns}); };

  /* ── Meal selection detail ─── */
  if (openBlock) {
    const block = mealPlan.blocks.find(b=>b.key===openBlock);
    if (!block) { setOpenBlock(null); return null; }
    return <MealDetail block={block} selIdx={selected[openBlock]??null} onClose={()=>setOpenBlock(null)} onSelect={i=>{ saveSel({...selected,[openBlock]:i}); setOpenBlock(null); }}/>;
  }

  /* ── Edit plan screen ─── */
  if (editMode) {
    return (
      <MealPlanEditor
        mealPlan={mealPlan}
        onSave={p=>{ saveMealPlan(p); setEditMode(false); }}
        onClose={()=>setEditMode(false)}
      />
    );
  }

  /* ── Normal view ─── */
  const totalKcal = mealPlan.blocks.reduce((a,b)=>{ const i=selected[b.key]; return a+(i!=null?b.options[i]?.kcal:0)||a; },0);
  const totalP    = mealPlan.blocks.reduce((a,b)=>{ const i=selected[b.key]; return a+(i!=null?b.options[i]?.p:0)||a; },0);
  const totalC    = mealPlan.blocks.reduce((a,b)=>{ const i=selected[b.key]; return a+(i!=null?b.options[i]?.c:0)||a; },0);
  const totalF    = mealPlan.blocks.reduce((a,b)=>{ const i=selected[b.key]; return a+(i!=null?b.options[i]?.f:0)||a; },0);

  return (
    <Screen>
      <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', marginBottom:4 }}>
        <div>
          <div style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--text-muted)', letterSpacing:'0.14em', textTransform:'uppercase' }}>Plan de comidas</div>
          <div style={{ fontFamily:'var(--serif)', fontStyle:'italic', fontSize:34, letterSpacing:'-0.02em', lineHeight:1.1, marginTop:6 }}>Alimentación</div>
        </div>
        <button onClick={()=>setEditMode(true)} style={{ flexShrink:0, background:'transparent', border:'1px solid var(--border-strong)', borderRadius:12, color:'var(--text-dim)', padding:'8px 14px', fontSize:13, cursor:'pointer', display:'flex', alignItems:'center', gap:6, fontFamily:'var(--sans)', marginBottom:4 }}>
          <I.Edit sz={13}/>Editar
        </button>
      </div>

      <Card style={{ marginTop:22, padding:22 }}>
        <div style={{ display:'flex', alignItems:'center', gap:18 }}>
          <CircleProg size={104} stroke={9} value={totalKcal} max={mealPlan.macros.kcal}>
            <div style={{ fontFamily:'var(--mono)', fontSize:20, fontWeight:500 }}>{totalKcal}</div>
            <div style={{ fontSize:10, color:'var(--text-muted)', marginTop:1 }}>/ {mealPlan.macros.kcal}</div>
          </CircleProg>
          <div style={{ flex:1, minWidth:0 }}>
            <Chip tone="accent" icon={<I.Target sz={11}/>}>Plan activo</Chip>
            <div style={{ marginTop:10, display:'flex', flexDirection:'column', gap:7 }}>
              <MBar label="Proteínas" value={totalP} max={mealPlan.macros.p} unit="g" accent/>
              <MBar label="Carbos"    value={totalC} max={mealPlan.macros.c} unit="g"/>
              <MBar label="Grasas"    value={totalF} max={mealPlan.macros.f} unit="g"/>
            </div>
          </div>
        </div>
      </Card>

      <div style={{ marginTop:26 }}>
        <SecTitle eyebrow="Hoy">Tus comidas</SecTitle>
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          {mealPlan.blocks.map(b=>{
            const idx=selected[b.key], picked=idx!=null?b.options[idx]:null;
            return (
              <Card key={b.key} onClick={()=>setOpenBlock(b.key)} style={{ padding:0 }}>
                <div style={{ padding:'18px 18px 14px' }}>
                  <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:12 }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                        <div style={{ fontSize:15.5, fontWeight:500 }}>{b.title}</div>
                        {picked&&<Chip tone="success" size="sm" icon={<I.Check sz={10} st={2.4}/>}>Elegido</Chip>}
                      </div>
                      <div style={{ marginTop:3, fontSize:12.5, color:'var(--text-dim)' }}>{picked?picked.name:b.subtitle}</div>
                    </div>
                    <I.ChevR sz={16} color="var(--text-muted)"/>
                  </div>
                  {!picked && b.options.length>0 && (
                    <div style={{ marginTop:12, display:'flex', gap:6, flexWrap:'wrap' }}>
                      {b.options.slice(0,3).map((o,i)=><div key={i} style={{ padding:'5px 10px', borderRadius:999, background:'var(--surface-2)', color:'var(--text-dim)', fontSize:11.5, whiteSpace:'nowrap', maxWidth:150, overflow:'hidden', textOverflow:'ellipsis' }}>{o.name}</div>)}
                    </div>
                  )}
                  {!picked && b.options.length===0 && (
                    <div style={{ marginTop:8, fontSize:12, color:'var(--text-muted)' }}>Sin opciones — editá el plan para agregar.</div>
                  )}
                  {picked && (
                    <div style={{ marginTop:12, display:'flex', gap:12 }}>
                      {[['P',picked.p],['C',picked.c],['G',picked.f]].map(([t,v])=>(
                        <div key={t} style={{ display:'flex', alignItems:'baseline', gap:3 }}>
                          <span style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--text-muted)' }}>{t}</span>
                          <span style={{ fontFamily:'var(--mono)', fontSize:13 }}>{v}g</span>
                        </div>
                      ))}
                      <span style={{ fontFamily:'var(--mono)', fontSize:13, marginLeft:'auto', color:'var(--accent)' }}>{picked.kcal} kcal</span>
                    </div>
                  )}
                </div>
              </Card>
            );
          })}
        </div>
      </div>
    </Screen>
  );
}

function MBar({ label, value, max, unit, accent }) {
  const pct=Math.min(1,(value||0)/max);
  return (
    <div>
      <div style={{ display:'flex', justifyContent:'space-between', fontSize:11, marginBottom:3 }}>
        <span style={{ color:'var(--text-muted)' }}>{label}</span>
        <span style={{ fontFamily:'var(--mono)', color:'var(--text-dim)' }}>{Math.round(value||0)}/{max}{unit}</span>
      </div>
      <div style={{ height:4, borderRadius:999, background:'var(--surface-2)', overflow:'hidden' }}>
        <div style={{ width:`${pct*100}%`, height:'100%', borderRadius:999, background:accent?'var(--accent)':'rgba(240,235,229,.55)', transition:'width 600ms cubic-bezier(.2,.7,.2,1)' }}/>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   MEAL PLAN EDITOR
═══════════════════════════════════════════════════════════════ */
function MealPlanEditor({ mealPlan: initPlan, onSave, onClose }) {
  const [plan, setPlan_]    = useState(()=>JSON.parse(JSON.stringify(initPlan)));
  const [editingOpt, setEditingOpt] = useState(null); // { blockKey, optIdx } — -1 = new

  const setMacro     = (k,v) => setPlan_(p=>({...p, macros:{...p.macros,[k]:+v||0}}));
  const updateBlock  = (key,upd) => setPlan_(p=>({...p, blocks:p.blocks.map(b=>b.key===key?{...b,...upd}:b)}));
  const deleteBlock  = (key) => setPlan_(p=>({...p, blocks:p.blocks.filter(b=>b.key!==key)}));
  const addBlock     = ()    => setPlan_(p=>({...p, blocks:[...p.blocks,{key:'block-'+uid(),title:'Nueva comida',subtitle:'',options:[]}]}));
  const deleteOpt    = (bk,oi) => setPlan_(p=>({...p, blocks:p.blocks.map(b=>b.key!==bk?b:{...b,options:b.options.filter((_,i)=>i!==oi)})}));
  const saveOpt      = (bk,oi,opt) => {
    setPlan_(p=>({...p, blocks:p.blocks.map(b=>{
      if(b.key!==bk) return b;
      const opts=[...b.options];
      oi===-1 ? opts.push(opt) : opts[oi]=opt;
      return {...b,options:opts};
    })}));
    setEditingOpt(null);
  };

  if (editingOpt) {
    const block = plan.blocks.find(b=>b.key===editingOpt.blockKey);
    const opt   = editingOpt.optIdx>=0 ? block?.options[editingOpt.optIdx] : null;
    return (
      <EditOptionScreen
        opt={opt}
        blockTitle={block?.title}
        onClose={()=>setEditingOpt(null)}
        onSave={updated=>saveOpt(editingOpt.blockKey, editingOpt.optIdx, updated)}
      />
    );
  }

  return (
    <div style={{ position:'absolute', inset:0, background:'var(--bg)', display:'flex', flexDirection:'column', zIndex:30, animation:'fade-in 260ms ease both' }}>
      <div style={{ height:56 }}/>
      {/* header */}
      <div style={{ padding:'6px 22px 14px', display:'flex', alignItems:'center', gap:12, flexShrink:0, borderBottom:'1px solid var(--border)' }}>
        <button onClick={onClose} style={{ width:34,height:34,borderRadius:999,background:'var(--surface)',border:'1px solid var(--border)',color:'var(--text-dim)',display:'flex',alignItems:'center',justifyContent:'center' }}><I.ChevL sz={18} st={1.8}/></button>
        <div style={{ flex:1 }}>
          <div style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--text-muted)', letterSpacing:'0.14em', textTransform:'uppercase' }}>Editando</div>
          <div style={{ fontSize:19, fontWeight:500, marginTop:2 }}>Plan de comidas</div>
        </div>
        <button onClick={()=>onSave(plan)} style={{ padding:'10px 18px', borderRadius:14, background:'var(--accent)', border:'none', color:'#1a0f0a', fontFamily:'var(--sans)', fontSize:14, fontWeight:500, cursor:'pointer' }}>Guardar</button>
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'16px 20px 48px', WebkitOverflowScrolling:'touch' }}>
        {/* Macro goals */}
        <div style={{ padding:18, borderRadius:18, background:'var(--surface)', border:'1px solid var(--border)', marginBottom:20 }}>
          <div style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--text-muted)', letterSpacing:'0.12em', textTransform:'uppercase', marginBottom:14 }}>Objetivos diarios</div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
            {[['kcal','kcal','Calorías'],['p','g','Proteínas'],['c','g','Carbos'],['f','g','Grasas']].map(([k,u,lb])=>(
              <div key={k}>
                <div style={{ fontSize:11, color:'var(--text-muted)', marginBottom:5, textTransform:'uppercase', letterSpacing:'0.06em' }}>{lb}</div>
                <div style={{ position:'relative' }}>
                  <input type="number" value={plan.macros[k]||''} onChange={e=>setMacro(k,e.target.value)} min={0}
                    style={{ width:'100%', padding:'10px 30px 10px 12px', borderRadius:10, background:'var(--bg)', border:'1px solid var(--border-strong)', color:'var(--text)', fontSize:15, fontFamily:'var(--mono)', outline:'none' }}
                    onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border-strong)'}/>
                  <span style={{ position:'absolute', right:10, top:'50%', transform:'translateY(-50%)', fontSize:11, color:'var(--text-muted)', fontFamily:'var(--mono)', pointerEvents:'none' }}>{u}</span>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Meal blocks */}
        {plan.blocks.map(b=>(
          <div key={b.key} style={{ marginBottom:14, borderRadius:18, background:'var(--surface)', border:'1px solid var(--border)', overflow:'hidden' }}>
            {/* block header */}
            <div style={{ padding:'14px 16px 10px', borderBottom:'1px solid var(--border)', display:'flex', alignItems:'flex-start', gap:10 }}>
              <div style={{ flex:1 }}>
                <input
                  value={b.title}
                  onChange={e=>updateBlock(b.key,{title:e.target.value})}
                  placeholder="Nombre de la comida"
                  style={{ background:'transparent', border:'none', color:'var(--text)', fontSize:15.5, fontWeight:500, fontFamily:'var(--sans)', outline:'none', padding:0, width:'100%' }}
                />
                <input
                  value={b.subtitle||''}
                  onChange={e=>updateBlock(b.key,{subtitle:e.target.value})}
                  placeholder="Ej. ~550 kcal"
                  style={{ background:'transparent', border:'none', color:'var(--text-muted)', fontSize:12.5, fontFamily:'var(--sans)', outline:'none', padding:0, marginTop:3, width:'100%' }}
                />
              </div>
              <button onClick={()=>deleteBlock(b.key)} style={{ background:'transparent', border:'none', color:'var(--text-muted)', cursor:'pointer', padding:4, flexShrink:0 }}><I.Trash sz={15}/></button>
            </div>
            {/* options */}
            <div style={{ padding:'6px 16px 12px' }}>
              {b.options.map((o,i)=>(
                <div key={i} style={{ display:'flex', alignItems:'center', gap:8, padding:'10px 0', borderBottom:'1px solid var(--border)' }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:13.5, fontWeight:500, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{o.name}</div>
                    <div style={{ fontSize:11.5, color:'var(--text-muted)', marginTop:2 }}>{o.kcal} kcal · P{o.p}g · C{o.c}g · G{o.f}g</div>
                  </div>
                  <button onClick={()=>setEditingOpt({blockKey:b.key,optIdx:i})} style={{ background:'transparent',border:'none',color:'var(--text-dim)',cursor:'pointer',padding:4,flexShrink:0 }}><I.Edit sz={14}/></button>
                  <button onClick={()=>deleteOpt(b.key,i)}                       style={{ background:'transparent',border:'none',color:'var(--text-muted)',cursor:'pointer',padding:4,flexShrink:0 }}><I.Trash sz={14}/></button>
                </div>
              ))}
              {b.options.length===0&&<div style={{ padding:'10px 0', fontSize:12.5, color:'var(--text-muted)' }}>Sin opciones todavía.</div>}
              <button onClick={()=>setEditingOpt({blockKey:b.key,optIdx:-1})}
                style={{ marginTop:10, display:'flex', alignItems:'center', gap:6, background:'transparent', border:'1px dashed var(--border-strong)', borderRadius:10, padding:'8px 14px', color:'var(--accent)', fontSize:13, cursor:'pointer', fontFamily:'var(--sans)' }}>
                <I.Plus sz={13} st={2}/>Agregar opción
              </button>
            </div>
          </div>
        ))}

        {/* add block */}
        <button onClick={addBlock}
          style={{ width:'100%', display:'flex', alignItems:'center', justifyContent:'center', gap:8, padding:14, borderRadius:16, background:'transparent', border:'1px dashed var(--border-strong)', color:'var(--text-dim)', fontSize:14, cursor:'pointer', fontFamily:'var(--sans)' }}>
          <I.Plus sz={16} st={2}/>Agregar comida
        </button>
      </div>
    </div>
  );
}

function EditOptionScreen({ opt, blockTitle, onClose, onSave }) {
  const [form, setForm] = useState(opt ? {...opt} : { name:'', desc:'', kcal:0, p:0, c:0, f:0 });
  const set   = (k,v) => setForm(f=>({...f,[k]:v}));
  const valid = form.name.trim().length>0;
  return (
    <div style={{ position:'absolute', inset:0, background:'var(--bg)', display:'flex', flexDirection:'column', zIndex:40, animation:'fade-in 260ms ease both' }}>
      <div style={{ height:56 }}/>
      <div style={{ padding:'6px 22px 14px', display:'flex', alignItems:'center', gap:12, flexShrink:0, borderBottom:'1px solid var(--border)' }}>
        <button onClick={onClose} style={{ width:34,height:34,borderRadius:999,background:'var(--surface)',border:'1px solid var(--border)',color:'var(--text-dim)',display:'flex',alignItems:'center',justifyContent:'center' }}><I.ChevL sz={18} st={1.8}/></button>
        <div style={{ flex:1 }}>
          <div style={{ fontFamily:'var(--mono)', fontSize:10, color:'var(--text-muted)', letterSpacing:'0.14em', textTransform:'uppercase' }}>{blockTitle}</div>
          <div style={{ fontSize:19, fontWeight:500, marginTop:2 }}>{opt ? 'Editar opción' : 'Nueva opción'}</div>
        </div>
      </div>
      <div style={{ flex:1, overflowY:'auto', padding:'18px 22px 40px', WebkitOverflowScrolling:'touch' }}>
        <Field label="Nombre" value={form.name} onChange={v=>set('name',v)} placeholder="Ej. Pollo con arroz"/>
        <Field label="Descripción" value={form.desc||''} onChange={v=>set('desc',v)} placeholder="Ej. 180g pollo · 120g arroz · brócoli"/>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:20 }}>
          {[['Calorías','kcal'],['Proteínas (g)','p'],['Carbos (g)','c'],['Grasas (g)','f']].map(([lb,k])=>(
            <div key={k}>
              <div style={{ fontSize:12, color:'var(--text-muted)', marginBottom:6, letterSpacing:'0.06em', textTransform:'uppercase' }}>{lb}</div>
              <input type="number" value={form[k]||''} onChange={e=>set(k,+e.target.value||0)} min={0}
                style={{ width:'100%', padding:'12px 14px', borderRadius:12, background:'var(--bg)', border:'1px solid var(--border-strong)', color:'var(--text)', fontSize:16, fontFamily:'var(--mono)', outline:'none' }}
                onFocus={e=>e.target.style.borderColor='var(--accent)'} onBlur={e=>e.target.style.borderColor='var(--border-strong)'}/>
            </div>
          ))}
        </div>
        <Btn size="lg" onClick={()=>onSave(form)} disabled={!valid} style={{ width:'100%', marginBottom:8 }} icon={<I.Save sz={18}/>}>
          {opt ? 'Guardar cambios' : 'Agregar opción'}
        </Btn>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   PROGRESO TAB
═══════════════════════════════════════════════════════════════ */
function ProgresoTab() {
  const [showWeightModal, setShowWeightModal] = useState(false);
  const [bodyLog, setBodyLog] = useState(()=>S.getBodyLog());
  const sessions = S.getSessions();

  // week activity from real sessions
  const now = new Date();
  const monday = new Date(now); monday.setDate(now.getDate()-((now.getDay()+6)%7)); monday.setHours(0,0,0,0);
  const weekDays = ['L','M','M','J','V','S','D'].map((_,i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return d.toISOString().slice(0,10); });
  const weekActivity = weekDays.map((dayIso,i)=>{
    const daySessions = sessions.filter(s=>s.date===dayIso);
    const mins = daySessions.reduce((a,s)=>a+Math.round(s.duration/60),0);
    return { day:['L','M','M','J','V','S','D'][i], mins };
  });

  // month sessions
  const monthStr = now.toISOString().slice(0,7);
  const monthSessions = sessions.filter(s=>s.date.startsWith(monthStr));
  const totalMins = monthSessions.reduce((a,s)=>a+Math.round(s.duration/60),0);

  // weight chart data
  const chartData = bodyLog.length>1 ? bodyLog.slice(-8).map(e=>({ d:fmtDate(e.date), v:e.weight })) : null;
  const latestWeight = bodyLog.length>0 ? bodyLog[bodyLog.length-1] : null;

  // PRs per exercise from sessions
  const prs = {};
  sessions.forEach(s=>s.exercises?.forEach(e=>{ if(!prs[e.id]||e.weight>prs[e.id].weight) prs[e.id]={ name:e.name, weight:e.weight, date:s.date }; }));
  const prList = Object.values(prs).sort((a,b)=>b.weight-a.weight).slice(0,5);

  const addWeight = (w) => {
    const entry = { date:today(), weight:w };
    S.addBodyEntry(entry);
    setBodyLog(S.getBodyLog());
    setShowWeightModal(false);
  };

  return (
    <>
    <Screen>
      <div>
        <div style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--text-muted)', letterSpacing:'0.14em', textTransform:'uppercase' }}>Seguimiento</div>
        <div style={{ fontFamily:'var(--serif)', fontStyle:'italic', fontSize:34, letterSpacing:'-0.02em', lineHeight:1.1, marginTop:6 }}>Tu progreso</div>
      </div>

      {/* body weight */}
      <Card accent style={{ marginTop:22, padding:22 }}>
        <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between' }}>
          <div>
            <Chip tone="accent" icon={<I.Scale sz={11}/>}>Peso corporal</Chip>
            {latestWeight ? (
              <div style={{ marginTop:14 }}>
                <div style={{ display:'flex', alignItems:'baseline', gap:6 }}>
                  <div style={{ fontFamily:'var(--mono)', fontSize:44, fontWeight:500, letterSpacing:'-0.02em' }}>{latestWeight.weight}</div>
                  <div style={{ fontSize:14, color:'var(--text-muted)' }}>kg</div>
                </div>
                <div style={{ fontSize:12.5, color:'var(--text-muted)', marginTop:4 }}>Último registro: {fmtDate(latestWeight.date)}</div>
              </div>
            ) : (
              <div style={{ marginTop:14, color:'var(--text-dim)', fontSize:14, lineHeight:1.5 }}>Todavía no registraste<br/>tu peso corporal.</div>
            )}
          </div>
          <button onClick={()=>setShowWeightModal(true)} style={{ padding:'10px 16px', borderRadius:14, background:'var(--accent)', border:'none', color:'#1a0f0a', fontFamily:'var(--sans)', fontSize:13, fontWeight:500, cursor:'pointer', display:'flex', alignItems:'center', gap:6 }}>
            <I.Plus sz={14} st={2}/>Registrar
          </button>
        </div>
        {chartData && (
          <>
            <div style={{ marginTop:20 }}><SmoothChart data={chartData} height={110}/></div>
            <div style={{ display:'flex', justifyContent:'space-between', fontFamily:'var(--mono)', fontSize:10, color:'var(--text-muted)', marginTop:6 }}>
              {chartData.map((p,i)=><span key={i}>{p.d.split(' ')[0]}</span>)}
            </div>
          </>
        )}
      </Card>

      {/* week activity */}
      <div style={{ marginTop:26 }}>
        <SecTitle eyebrow="Esta semana" action={<span style={{ fontFamily:'var(--mono)', fontSize:11, color:'var(--text-dim)' }}>{weekActivity.reduce((a,d)=>a+d.mins,0)} min</span>}>
          {weekActivity.filter(d=>d.mins>0).length} sesiones
        </SecTitle>
        <Card style={{ padding:18 }}>
          <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', gap:6, height:80 }}>
            {weekActivity.map((d,i)=>{
              const mx=Math.max(...weekActivity.map(x=>x.mins),1);
              const h=d.mins===0?6:12+(d.mins/mx)*62;
              return (
                <div key={i} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:6 }}>
                  <div style={{ width:'100%', height:h, borderRadius:8, background:d.mins>0?'var(--accent)':'var(--surface-2)', opacity:d.mins>0?1:.4, transition:'all 600ms' }}/>
                  <div style={{ fontFamily:'var(--mono)', fontSize:10.5, color:d.mins>0?'var(--text-dim)':'var(--text-muted)' }}>{d.day}</div>
                </div>
              );
            })}
          </div>
        </Card>
      </div>

      {/* month stats */}
      <div style={{ marginTop:26 }}>
        <SecTitle eyebrow="Este mes">Resumen</SecTitle>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          {[
            [I.Bolt,  'Sesiones',  String(monthSessions.length), `esta semana: ${weekActivity.filter(d=>d.mins>0).length}`],
            [I.Timer, 'Horas',     totalMins>=60?`${(totalMins/60).toFixed(1)}h`:`${totalMins}min`, 'entrenando'],
            [I.Flame, 'Calorías',  monthSessions.length>0?`~${Math.round(totalMins*6.5/1000*10)/10}k`:'—', 'quemadas aprox.'],
            [I.Trophy,'PRs',       String(prList.length), 'ejercicios registrados'],
          ].map(([Icon,lb,val,sub])=>(
            <div key={lb} style={{ padding:'14px 16px', borderRadius:16, background:'var(--surface)', border:'1px solid var(--border)' }}>
              <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                <Icon sz={14} color="var(--accent)"/>
                <div style={{ fontSize:11, color:'var(--text-muted)', letterSpacing:'0.08em', textTransform:'uppercase' }}>{lb}</div>
              </div>
              <div style={{ marginTop:8, fontFamily:'var(--mono)', fontSize:24, fontWeight:500, letterSpacing:'-0.01em' }}>{val}</div>
              <div style={{ fontSize:11, color:'var(--text-muted)', marginTop:2 }}>{sub}</div>
            </div>
          ))}
        </div>
      </div>

      {/* PRs from real sessions */}
      {prList.length>0 && (
        <div style={{ marginTop:26 }}>
          <SecTitle eyebrow="Récords personales">Tus PRs</SecTitle>
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {prList.map((p,i)=>(
              <div key={i} style={{ display:'flex', alignItems:'center', gap:14, padding:'14px 16px', borderRadius:16, background:'var(--surface)', border:'1px solid var(--border)' }}>
                <div style={{ width:36, height:36, borderRadius:10, background:'var(--accent-dim)', display:'flex', alignItems:'center', justifyContent:'center', color:'var(--accent)' }}><I.Trophy sz={17}/></div>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:14, fontWeight:500 }}>{p.name}</div>
                  <div style={{ marginTop:2, fontSize:12, color:'var(--text-muted)' }}>{fmtDate(p.date)}</div>
                </div>
                <div style={{ fontFamily:'var(--mono)', fontSize:15, fontWeight:500 }}>{p.weight}<span style={{ fontSize:10, color:'var(--text-muted)', marginLeft:2 }}>kg</span></div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* empty state */}
      {sessions.length===0 && prList.length===0 && (
        <div style={{ marginTop:32, textAlign:'center', padding:'32px 24px', background:'var(--surface)', borderRadius:20, border:'1px dashed var(--border-strong)' }}>
          <div style={{ fontSize:36, marginBottom:12 }}>📊</div>
          <div style={{ fontSize:16, fontWeight:500, marginBottom:8 }}>Todavía sin datos</div>
          <div style={{ fontSize:14, color:'var(--text-dim)', lineHeight:1.6 }}>Completá tu primer entrenamiento para ver tu progreso acá. Los récords y gráficos se van llenando solos.</div>
        </div>
      )}

      {/* sessions history */}
      {sessions.length>0 && (
        <div style={{ marginTop:26 }}>
          <SecTitle eyebrow="Historial">Últimas sesiones</SecTitle>
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {sessions.slice(0,5).map(s=>(
              <div key={s.id} style={{ padding:'14px 16px', borderRadius:16, background:'var(--surface)', border:'1px solid var(--border)' }}>
                <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                  <div>
                    <div style={{ fontSize:13.5, fontWeight:500 }}>{fmtDate(s.date)}</div>
                    <div style={{ fontSize:12, color:'var(--text-muted)', marginTop:2 }}>{s.exercises?.length||0} ejercicios · {fmtSecs(s.duration||0)}</div>
                  </div>
                  <Chip tone="success" size="sm" icon={<I.Check sz={10} st={2.4}/>}>Completado</Chip>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </Screen>
    {showWeightModal && <WeightModal onClose={()=>setShowWeightModal(false)} onSave={addWeight}/>}
    </>
  );
}

function WeightModal({ onClose, onSave }) {
  const last = S.getBodyLog().slice(-1)[0];
  const [val, setVal] = useState(String(last?.weight||''));
  const n = parseFloat(val);
  const valid = !isNaN(n) && n>20 && n<350;
  return (
    <Modal title="Registrar peso" onClose={onClose}>
      <div style={{ textAlign:'center', padding:'8px 0 24px' }}>
        <div style={{ position:'relative', display:'inline-block' }}>
          <input type="number" value={val} onChange={e=>setVal(e.target.value)} placeholder="00.0" step="0.1" min="20" max="350" style={{ width:160, padding:'14px 16px', borderRadius:18, background:'var(--bg)', border:'2px solid var(--accent)', color:'var(--text)', fontSize:36, fontFamily:'var(--mono)', fontWeight:500, textAlign:'center', outline:'none', letterSpacing:'-0.02em' }}/>
          <div style={{ position:'absolute', right:16, top:'50%', transform:'translateY(-50%)', fontSize:14, color:'var(--text-muted)' }}>kg</div>
        </div>
        <div style={{ fontSize:12, color:'var(--text-muted)', marginTop:10 }}>
          {new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}
        </div>
      </div>
      <Btn size="lg" onClick={()=>onSave(n)} disabled={!valid} style={{ width:'100%', marginBottom:8 }} icon={<I.Save sz={18}/>}>Guardar</Btn>
    </Modal>
  );
}

/* ═══════════════════════════════════════════════════════════════
   ROOT
═══════════════════════════════════════════════════════════════ */
const TABS = [
  { id:'rutina',    label:'Rutina',   icon:I.Dumbbell },
  { id:'comida',    label:'Comida',   icon:I.Apple    },
  { id:'progreso',  label:'Progreso', icon:I.Chart    },
];

function App() {
  const [phase,    setPhase]    = useState(()=>S.getUser()?'app':'onboarding');
  const [user,     setUser]     = useState(()=>S.getUser()||{});
  const [tab,      setTab]      = useState('rutina');
  const [training, setTraining] = useState(null);

  return (
    <div className="app">
      {phase==='onboarding' && <Onboarding onFinish={u=>{ setUser(u); setPhase('welcome'); }}/>}
      {phase==='welcome'    && <WelcomeAnim name={user.name} onDone={()=>setPhase('app')}/>}
      {phase==='app' && <>
        {tab==='rutina'   && <RutinaTab   training={training} setTraining={setTraining}/>}
        {tab==='comida'   && <AlimentacionTab/>}
        {tab==='progreso' && <ProgresoTab/>}
        {!training && <TabBar tabs={TABS} active={tab} onChange={setTab}/>}
      </>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./pulso-sw.js').catch(()=>{});
    });
  }
</script>
</body>
</html>
