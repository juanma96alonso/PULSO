  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:            #1a1614;
      --bg-2:          #15110f;
      --surface:       #221d1a;
      --surface-2:     #2a2421;
      --elevated:      #322a26;
      --text:          #f0ebe5;
      --text-dim:      #a89e94;
      --text-muted:    #6b6259;
      --border:        rgba(240,235,229,0.07);
      --border-strong: rgba(240,235,229,0.12);
      --accent:        #D97757;
      --accent-soft:   #2e1f1a;
      --accent-dim:    rgba(217,119,87,0.16);
      --success:       #7fa67a;
      --warning:       #d9b657;
      --danger:        #c4665e;
      --sans:          'Geist', -apple-system, system-ui, sans-serif;
      --mono:          'Geist Mono', ui-monospace, monospace;
      --serif:         'Instrument Serif', Georgia, serif;
      --safe-top:      env(safe-area-inset-top, 0px);
      --safe-bottom:   env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0e0b0a;
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    body {
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(217,119,87,0.06), transparent 60%),
        radial-gradient(900px 500px at 80% 100%, rgba(217,119,87,0.04), transparent 60%),
        #0e0b0a;
    }

    #root {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100dvh;
    }

    .pulso-app {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* hide scrollbars globally */
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }

    input, textarea, button { font-family: var(--sans); }
    button { cursor: pointer; }

    @keyframes pulse-ring {
      0%   { transform: scale(0.9); opacity: 0.9; }
      80%  { transform: scale(1.4); opacity: 0; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    @keyframes float-up {
      0%   { transform: translateY(8px); opacity: 0; }
      100% { transform: translateY(0);   opacity: 1; }
    }
    @keyframes fade-in {
      from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes scale-in {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes lift {
      0%, 100% { transform: translateY(0)   rotate(-4deg); }
      50%      { transform: translateY(-6px) rotate(4deg); }
    }
  </style>
</head>

    function Button({ children, variant = 'primary', size = 'md', icon, onClick, style = {}, disabled }) {
      const sz = { sm: { fontSize: 13, padding: '8px 14px',  borderRadius: 10, height: 34 },
                   md: { fontSize: 15, padding: '12px 18px', borderRadius: 14, height: 46 },
                   lg: { fontSize: 16, padding: '16px 22px', borderRadius: 18, height: 56 } }[size];
      const va = { primary: { background: 'var(--accent)',      color: '#1a0f0a' },
                   soft:    { background: 'var(--accent-soft)',  color: 'var(--accent)' },
                   ghost:   { background: 'transparent',         color: 'var(--text)', border: '1px solid var(--border-strong)' },
                   danger:  { background: 'rgba(196,102,94,.16)',color: 'var(--danger)' },
                   dark:    { background: 'var(--surface-2)',     color: 'var(--text)' } }[variant];
      return (
        <button onClick={onClick} disabled={disabled}
          onMouseDown={e => { e.currentTarget.style.transform = 'scale(0.97)'; }}
          onMouseUp={e => { e.currentTarget.style.transform = ''; }}
          onMouseLeave={e => { e.currentTarget.style.transform = ''; }}
          onTouchStart={e => { e.currentTarget.style.transform = 'scale(0.97)'; }}
          onTouchEnd={e => { e.currentTarget.style.transform = ''; }}
          style={{
            border: 'none', fontFamily: 'var(--sans)', fontWeight: 500,
            display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
            transition: 'transform 120ms ease, background 160ms, opacity 160ms',
            opacity: disabled ? 0.45 : 1,
            cursor: disabled ? 'not-allowed' : 'pointer',
            ...sz, ...va, ...style,
          }}>
          {icon}{children}
        </button>
      );
    }

    function Card({ children, style = {}, onClick, accent = false }) {

          border: '1px solid var(--border)',
          borderRadius: 20,
          cursor: onClick ? 'pointer' : 'default',
          transition: 'background 160ms, border-color 160ms',
          ...style,
        }}>
          {children}
        </div>
      );
    }

    function SectionTitle({ children, action, eyebrow }) {
      return (

          </div>
          {action}
        </div>
      );
    }

    function TabBar({ tabs, active, onChange }) {
      return (
        <div style={{
          position: 'absolute', left: 0, right: 0, bottom: 0,
          paddingBottom: `max(20px, var(--safe-bottom))`,
          paddingTop: 10, paddingLeft: 14, paddingRight: 14,

          zIndex: 40,
        }}>

            display: 'flex', gap: 0,
            background: 'rgba(34,29,26,0.72)',
            border: '1px solid var(--border-strong)',
            borderRadius: 22, padding: 6,

              return (

                  background: on ? 'var(--accent)' : 'transparent',

    function Chip({ children, tone = 'default', size = 'md', icon }) {
      const t = { default: { bg: 'var(--surface-2)',             fg: 'var(--text-dim)' },
                  accent:  { bg: 'var(--accent-dim)',             fg: 'var(--accent)' },
                  success: { bg: 'rgba(127,166,122,.14)',         fg: 'var(--success)' },
                  warning: { bg: 'rgba(217,182,87,.14)',          fg: 'var(--warning)' },
                  ghost:   { bg: 'transparent',                   fg: 'var(--text-dim)' } }[tone];
      const s = { sm: { fontSize: 11, padding: '4px 9px' }, md: { fontSize: 12, padding: '6px 11px' } }[size];
      return (
        <span style={{
          display: 'inline-flex', alignItems: 'center', gap: 5, borderRadius: 999,
          background: t.bg, color: t.fg, fontFamily: 'var(--sans)', fontWeight: 500,
          letterSpacing: '0.01em',
          border: tone === 'ghost' ? '1px solid var(--border-strong)' : 'none',
          ...s,
        }}>{icon}{children}</span>
      );
    }

    function CircleProgress({ value, max = 100, size = 120, stroke = 10, color = 'var(--accent)', track = 'rgba(217,119,87,.12)', children }) {
      const r = (size - stroke) / 2;
      const c = 2 * Math.PI * r;
      const pct = Math.max(0, Math.min(1, value / max));
      const [animPct, setAnimPct] = useState(0);
      useEffect(() => { const t = setTimeout(() => setAnimPct(pct), 120); return () => clearTimeout(t); }, [pct]);
      return (
        <div style={{ position: 'relative', width: size, height: size, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
          <svg width={size} height={size} style={{ transform: 'rotate(-90deg)', position: 'absolute' }}>
            <circle cx={size/2} cy={size/2} r={r} stroke={track} strokeWidth={stroke} fill="none" />
            <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
              strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c*(1-animPct)}
              style={{ transition: 'stroke-dashoffset 900ms cubic-bezier(.2,.7,.2,1)' }} />
          </svg>
          <div style={{ position: 'relative', textAlign: 'center', lineHeight: 1.1 }}>{children}</div>
        </div>
      );
    }

    function SmoothLine({ data, width = 300, height = 130, color = 'var(--accent)', padding = 14 }) {
      if (!data || data.length < 2) return null;
      const ys = data.map(d => d.v);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      const rangeY = (maxY - minY) || 1;
      const yPad = rangeY * 0.25;
      const lo = minY - yPad, hi = maxY + yPad;
      const W = width - padding * 2, H = height - padding * 2;
      const px = i => padding + (W * i) / (ys.length - 1);
      const py = v => padding + H - ((v - lo) / (hi - lo)) * H;
      const pts = ys.map((y, i) => [px(i), py(y)]);
      let d = `M ${pts[0][0]} ${pts[0][1]}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const [,  y0] = pts[Math.max(0, i - 1)];
        const [x1, y1] = pts[i];
        const [x2, y2] = pts[i + 1];
        const [x3, y3] = pts[Math.min(pts.length - 1, i + 2)];
        const [x0]     = pts[Math.max(0, i - 1)];
        const t = 0.22;
        const c1x = x1 + (x2 - x0) * t, c1y = y1 + (y2 - y0) * t;
        const c2x = x2 - (x3 - x1) * t, c2y = y2 - (y3 - y1) * t;
        d += ` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x2} ${y2}`;
      }
      const area = `${d} L ${pts[pts.length-1][0]} ${height-padding} L ${pts[0][0]} ${height-padding} Z`;
      return (
        <svg width={width} height={height} style={{ display: 'block', width: '100%', height: 'auto' }}>
          <defs>
            <linearGradient id="pl-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stopColor="rgba(217,119,87,0.35)" />
              <stop offset="100%" stopColor="rgba(217,119,87,0)" />
            </linearGradient>
          </defs>
          <path d={area} fill="url(#pl-grad)" />
          <path d={d} stroke={color} strokeWidth={2.4} fill="none" strokeLinecap="round" />
          {pts.map(([x, y], i) => (
            <circle key={i} cx={x} cy={y}
              r={i === pts.length - 1 ? 4.5 : 2.4}
              fill={i === pts.length - 1 ? color : 'var(--bg)'}
              stroke={color} strokeWidth={i === pts.length - 1 ? 2 : 1.4} />
          ))}
        </svg>
      );
    }

    /* ─────────────────────────────────────────────────────────────
       ONBOARDING
    ───────────────────────────────────────────────────────────── */
    function Onboarding({ onFinish }) {
      const [step, setStep] = useState(-1);
      const [user, setUser] = useState({ name:'', goal:null, level:null, freq:null, place:null, duration:null, notes:'' });
      const q = ONBOARDING_QS[step];
      const totalQ = ONBOARDING_QS.length;
      const next = () => setStep(s => s + 1);
      const back = () => setStep(s => Math.max(-1, s - 1));
      const setAns = (id, v) => setUser(u => ({ ...u, [id]: v }));

      if (step === -1) return <WelcomeStart onStart={next} />;
      if (step === totalQ) return <OnboardingSummary user={user} onFinish={() => onFinish(user)} onBack={back} />;

      const canAdv = q.optional ? true
        : q.kind === 'text' ? (user[q.id] || '').trim().length > 0
        : q.kind === 'longtext' ? true
        : user[q.id] !== null && user[q.id] !== undefined;

      return (
        <div style={{ position: 'relative', height: '100%', display: 'flex', flexDirection: 'column' }}>
          <div style={{ height: 56 }} />
          {/* progress bar */}
          <div style={{ padding: '6px 22px 22px', display: 'flex', alignItems: 'center', gap: 12 }}>
            <button onClick={back} style={{
              width: 34, height: 34, borderRadius: 999,
              background: 'var(--surface)', border: '1px solid var(--border)',
              color: 'var(--text-dim)', display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}><I.ChevLeft sz={18} st={1.8} /></button>
            <div style={{ flex: 1, display: 'flex', gap: 5 }}>
              {ONBOARDING_QS.map((_, i) => (
                <div key={i} style={{
                  flex: 1, height: 4, borderRadius: 999,
                  background: i <= step ? 'var(--accent)' : 'var(--surface-2)',
                  transition: 'background 280ms',
                }} />
              ))}
            </div>
            <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--text-muted)', minWidth: 32, textAlign: 'right' }}>
              {step + 1}/{totalQ}
            </div>
          </div>
          {/* question */}
          <div key={step} style={{ flex: 1, overflowY: 'auto', padding: '8px 22px 24px', animation: 'float-up 360ms cubic-bezier(.2,.7,.2,1) both' }}>
            <div style={{ fontSize: 28, fontWeight: 500, letterSpacing: '-0.025em', lineHeight: 1.15, marginBottom: 8 }}>{q.title}</div>
            {q.subtitle && <div style={{ color: 'var(--text-dim)', fontSize: 14.5, lineHeight: 1.45, marginBottom: 26 }}>{q.subtitle}</div>}
            {q.kind === 'text' && (
              <OField value={user[q.id]} onChange={v => setAns(q.id, v)} placeholder={q.placeholder} autoFocus />
            )}
            {q.kind === 'longtext' && (
              <OTextArea value={user[q.id]} onChange={v => setAns(q.id, v)} placeholder={q.placeholder} />
            )}
            {q.kind === 'choice' && (
              <ChoiceList options={q.options} value={user[q.id]} onChange={v => setAns(q.id, v)} allowOther={q.allowOther} onNext={canAdv ? next : null} />
            )}
          </div>
          {/* CTA */}
          <div style={{ padding: '12px 22px 36px', background: 'linear-gradient(180deg,transparent,var(--bg) 50%)' }}>
            <Button size="lg" onClick={next} disabled={!canAdv} style={{ width: '100%' }}>
              {step === totalQ - 1 ? 'Listo' : 'Continuar'} <I.ChevRight sz={18} />
            </Button>
          </div>
        </div>
      );
    }

    function WelcomeStart({ onStart }) {
      return (
        <div style={{ position: 'relative', height: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', padding: '100px 28px 48px', textAlign: 'left' }}>

                🏋️

            </div>

          </div>
          <div>
            <Button size="lg" onClick={onStart} style={{ width: '100%' }}>
              Empezar <I.ChevRight sz={18} />

            <div style={{ marginTop: 14, textAlign: 'center', color: 'var(--text-muted)', fontSize: 12.5 }}>
              ¿Ya tenés cuenta? <span style={{ color: 'var(--accent)' }}>Ingresar</span>

    function ChoiceList({ options, value, onChange, allowOther, onNext }) {
      const [otherOpen, setOtherOpen] = useState(false);
      const [otherVal, setOtherVal] = useState('');
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {options.map(o => {
            const on = value === o.v;
            return (
              <button key={o.v} onClick={() => { onChange(o.v); if (onNext) setTimeout(onNext, 180); }} style={{
                display: 'flex', alignItems: 'center', gap: 14,
                padding: '14px 16px', borderRadius: 16,
                background: on ? 'var(--accent-dim)' : 'var(--surface)',

                )}
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 15, fontWeight: 500 }}>{o.label}</div>
                  {o.desc && <div style={{ fontSize: 12.5, color: 'var(--text-dim)', marginTop: 2 }}>{o.desc}</div>}
                </div>

              </button>

              border: `1px dashed ${otherOpen ? 'var(--accent)' : 'var(--border-strong)'}`,
              color: 'var(--text-dim)', textAlign: 'left', fontFamily: 'var(--sans)', fontSize: 14,
            }}>
              {otherOpen ? '✕ Escribilo abajo' : 'Otra cosa…'}

            <OField value={otherVal} onChange={v => { setOtherVal(v); onChange(v); }} placeholder="Contame tu objetivo" autoFocus />

      );
    }

    function OField({ value, onChange, placeholder, autoFocus }) {
      const ref = useRef(null);
      useEffect(() => { if (autoFocus && ref.current) ref.current.focus(); }, []);
      return (
        <input ref={ref} value={value || ''} onChange={e => onChange(e.target.value)}
          placeholder={placeholder} style={{
            width: '100%', padding: '16px 18px', borderRadius: 16,
            background: 'var(--surface)', border: '1px solid var(--border-strong)',
            color: 'var(--text)', fontFamily: 'var(--sans)', fontSize: 16,
            outline: 'none', transition: 'border-color 160ms',
          }}
          onFocus={e => e.target.style.borderColor = 'var(--accent)'}
          onBlur={e => e.target.style.borderColor = 'var(--border-strong)'} />
      );
    }

    function OTextArea({ value, onChange, placeholder }) {
      return (
        <textarea value={value || ''} onChange={e => onChange(e.target.value)}
          placeholder={placeholder} rows={5} style={{
            width: '100%', padding: '16px 18px', borderRadius: 16,
            background: 'var(--surface)', border: '1px solid var(--border-strong)',
            color: 'var(--text)', fontFamily: 'var(--sans)', fontSize: 15,
            outline: 'none', resize: 'none', minHeight: 130,
          }} />
      );
    }

    function OnboardingSummary({ user, onFinish, onBack }) {
      const goalLabel = ({ fat:'bajar grasa', mass:'ganar músculo', tone:'tonificar', keep:'mantenerte', cond:'mejorar tu resistencia' })[user.goal] || (typeof user.goal === 'string' ? user.goal : 'tu objetivo');
      const placeLabel = ({ gym:'gimnasio', home:'casa', out:'aire libre', mix:'modo mixto' })[user.place] || 'entrenamiento';
      const lvl = ({ beg:'principiante', int:'intermedio', adv:'avanzado' })[user.level] || 'tu nivel';
      const freq = user.freq || 4, dur = user.duration || 45;
      return (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
          <div style={{ height: 80 }} />
          <div style={{ padding: '0 22px 24px', flex: 1, overflowY: 'auto' }}>
            <div style={{ animation: 'float-up 500ms cubic-bezier(.2,.7,.2,1) both' }}>
              <Chip tone="accent" icon={<I.Sparkle sz={12} />}>Plan generado</Chip>
              <div style={{ fontFamily: 'var(--serif)', fontStyle: 'italic', fontSize: 36, lineHeight: 1.1, letterSpacing: '-0.02em', margin: '14px 0 8px' }}>

              </div>
              <div style={{ color: 'var(--text)', fontSize: 14, lineHeight: 1.5 }}>
                Empezamos suave. Te genero una rutina base que vas calibrando con cada sesión.
              </div>

          </div>
          <div style={{ padding: '12px 22px 36px' }}>
            <Button size="lg" onClick={onFinish} style={{ width: '100%' }}>
              Entrar a Pulso <I.ChevRight sz={18} />
            </Button>
          </div>
        </div>
      );
    }

    function SumRow({ icon, label, value }) {
      return (
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '14px 16px', borderRadius: 14, background: 'var(--surface)', border: '1px solid var(--border)' }}>

            <div style={{ fontSize: 14.5, color: 'var(--text)', marginTop: 2, textTransform: 'capitalize' }}>{value}</div>
          </div>

    ───────────────────────────────────────────────────────────── */

          {/* week */}
          <div style={{ marginTop: 26 }}>
            <SectionTitle eyebrow="Esta semana" action={<button style={{ background:'transparent', border:'none', color:'var(--accent)', fontSize:13, cursor:'pointer', fontFamily:'var(--sans)' }}>Ver mes</button>}>Tu semana</SectionTitle>
            <div style={{ display: 'flex', gap: 6 }}>
              {WEEK_PLAN.map((d, i) => {
                const isToday = d.today, isDone = d.done === true, isRest = d.rest;
                return (
                  <div key={i} style={{ flex: 1, padding: '10px 4px 12px', borderRadius: 14, background: isToday ? 'var(--accent-dim)' : 'var(--surface)', border: `1px solid ${isToday ? 'var(--accent)' : 'var(--border)'}`, textAlign: 'center' }}>
                    <div style={{ fontSize: 10.5, color: isToday ? 'var(--accent)' : 'var(--text-muted)', fontFamily: 'var(--mono)', letterSpacing: '0.08em' }}>{d.day}</div>
                    <div style={{ marginTop: 8, width: 28, height: 28, margin: '8px auto 0', borderRadius: 999, background: isDone ? 'var(--accent)' : (isRest ? 'transparent' : 'var(--surface-2)'), border: isRest ? '1px dashed var(--border-strong)' : 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', color: isDone ? '#1a0f0a' : (isRest ? 'var(--text-muted)' : 'var(--text-dim)'), fontFamily: 'var(--serif)', fontStyle: 'italic', fontSize: 14, fontWeight: 500 }}>
                      {isDone ? <I.Check sz={14} st={2.4} /> : d.label}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* exercise list */}
          <div style={{ marginTop: 28 }}>
            <SectionTitle eyebrow="Ejercicios de hoy" action={
              <button style={{ background:'transparent', border:'none', color:'var(--accent)', fontSize:13, cursor:'pointer', fontFamily:'var(--sans)', display:'flex', alignItems:'center', gap:4 }}>
                <I.Plus sz={14} st={2} />Agregar
              </button>
            }>Plan</SectionTitle>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {ROUTINE_TODAY.exercises.map((e, i) => <ExerciseRow key={e.id} ex={e} num={i+1} />)}
            </div>
          </div>

          {/* AI regen */}
          <div style={{ marginTop: 22, padding: 18, borderRadius: 18, background: 'var(--surface)', border: '1px dashed var(--border-strong)' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
              <div style={{ width: 32, height: 32, borderRadius: 10, background: 'var(--accent-dim)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <I.Sparkle sz={16} color="var(--accent)" />
              </div>
              <div style={{ fontSize: 14, fontWeight: 500 }}>Regenerar con IA</div>
            </div>
            <div style={{ fontSize: 12.5, color: 'var(--text-dim)', lineHeight: 1.5 }}>Pedí cambios: "más volumen", "menos prensa", "agregar cardio al final"…</div>
            <Button size="sm" variant="soft" style={{ marginTop: 12 }} icon={<I.Sparkle sz={13} />}>Pedir cambio</Button>
          </div>
        </Screen>
      );
    }

    function ExerciseRow({ ex, num }) {
      const up = ex.suggestion === 'subir';
      return (
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '14px 16px', borderRadius: 16, background: 'var(--surface)', border: '1px solid var(--border)' }}>
          <div style={{ width: 30, height: 30, borderRadius: 10, flexShrink: 0, background: 'var(--surface-2)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'var(--mono)', fontSize: 12, color: 'var(--text-dim)' }}>{String(num).padStart(2,'0')}</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 14.5, fontWeight: 500, lineHeight: 1.2 }}>{ex.name}</div>
            <div style={{ marginTop: 3, fontSize: 12, color: 'var(--text-dim)' }}>{ex.sets} × {ex.reps} · {ex.muscle}</div>
          </div>
          <div style={{ textAlign: 'right', flexShrink: 0 }}>
            <div style={{ fontFamily: 'var(--mono)', fontSize: 14.5, color: 'var(--text)' }}>{ex.lastWeight}<span style={{ fontSize: 10.5, color: 'var(--text-muted)', marginLeft: 2 }}>kg</span></div>
            {up ? (
              <div style={{ fontSize: 10.5, color: 'var(--accent)', marginTop: 3, display: 'flex', alignItems: 'center', gap: 3, justifyContent: 'flex-end' }}><I.ArrowUp sz={10} st={2.2} />subir</div>
            ) : (
              <div style={{ fontSize: 10.5, color: 'var(--text-muted)', marginTop: 3 }}>sesión {ex.sessionsAtWeight}/3</div>
            )}
          </div>
        </div>
      );
    }

    /* ─────────────────────────────────────────────────────────────
       TRAINING MODE
    ───────────────────────────────────────────────────────────── */
    function TrainingMode({ session, onExit }) {
      const [exIdx,  setExIdx]  = useState(0);
      const [doneSets, setDone] = useState({});
      const [weights,  setWts]  = useState(() => Object.fromEntries(ROUTINE_TODAY.exercises.map(e => [e.id, e.lastWeight])));
      const [timer,    setTimer]= useState(null);
      const [elapsed,  setEl]   = useState(0);
      const [finished, setFin]  = useState(false);

      const ex = ROUTINE_TODAY.exercises[exIdx];
      const dsThis = doneSets[ex.id] || 0;
      const totalEx = ROUTINE_TODAY.exercises.length;
      const overallDone  = ROUTINE_TODAY.exercises.reduce((a, e) => a + (doneSets[e.id] || 0), 0);
      const overallTotal = ROUTINE_TODAY.exercises.reduce((a, e) => a + e.sets, 0);

      useEffect(() => { const t = setInterval(() => setEl(s => s + 1), 1000); return () => clearInterval(t); }, []);
      useEffect(() => {
        if (!timer || timer.secondsLeft <= 0) return;
        const t = setTimeout(() => setTimer(tm => tm ? { ...tm, secondsLeft: tm.secondsLeft - 1 } : null), 1000);
        return () => clearTimeout(t);
      }, [timer]);

      const completeSet = () => {
        if (dsThis >= ex.sets) return;
        setDone(c => ({ ...c, [ex.id]: (c[ex.id] || 0) + 1 }));
        setTimer({ secondsLeft: ex.restSec, total: ex.restSec });
      };
      const next = () => { if (exIdx < totalEx - 1) { setExIdx(i => i + 1); setTimer(null); } else { setFin(true); } };
      const prev = () => { if (exIdx > 0) { setExIdx(i => i - 1); setTimer(null); } };
      const adjWeight = d => setWts(w => ({ ...w, [ex.id]: Math.max(0, +((w[ex.id] || 0) + d).toFixed(2)) }));

      if (finished) return <TrainingDone elapsed={elapsed} setsDone={overallDone} onExit={onExit} />;

      return (
        <div style={{ position: 'relative', height: '100%', background: 'var(--bg)', display: 'flex', flexDirection: 'column' }}>
          <div style={{ height: 56 }} />
          {/* header */}
          <div style={{ padding: '4px 22px 12px', display: 'flex', alignItems: 'center', gap: 10 }}>
            <button onClick={onExit} style={{ width: 34, height: 34, borderRadius: 999, background: 'var(--surface)', border: '1px solid var(--border)', color: 'var(--text-dim)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <I.X sz={16} st={2} />
            </button>
            <div style={{ flex: 1, textAlign: 'center' }}>
              <div style={{ fontFamily: 'var(--mono)', fontSize: 10.5, color: 'var(--text-muted)', letterSpacing: '0.14em', textTransform: 'uppercase' }}>Entrenando · día {ROUTINE_TODAY.letter}</div>
              <div style={{ fontFamily: 'var(--mono)', fontSize: 14, color: 'var(--text)', marginTop: 2 }}>{fmt(elapsed)}</div>
            </div>
            <div style={{ width: 34, height: 34, borderRadius: 999, background: 'var(--surface)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <I.More sz={16} color="var(--text-dim)" />
            </div>
          </div>

          {/* progress dots */}
          <div style={{ padding: '0 22px 18px' }}>
            <div style={{ display: 'flex', gap: 4 }}>
              {ROUTINE_TODAY.exercises.map((e, i) => (
                <div key={e.id} style={{ flex: 1, height: 3, borderRadius: 999, background: i < exIdx ? 'var(--accent)' : i === exIdx ? 'var(--accent-dim)' : 'var(--surface-2)', position: 'relative', overflow: 'hidden' }}>
                  {i === exIdx && <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: `${(dsThis / ex.sets) * 100}%`, background: 'var(--accent)', transition: 'width 320ms ease' }} />}
                </div>
              ))}
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8, fontSize: 11, color: 'var(--text-muted)' }}>
              <span style={{ fontFamily: 'var(--mono)' }}>{String(exIdx+1).padStart(2,'0')} de {String(totalEx).padStart(2,'0')}</span>
              <span style={{ fontFamily: 'var(--mono)' }}>{overallDone}/{overallTotal} series</span>
            </div>
          </div>

          {/* main content */}
          <div key={ex.id} style={{ flex: 1, overflowY: 'auto', padding: '0 22px 24px', animation: 'fade-in 280ms ease both', WebkitOverflowScrolling: 'touch' }}>
            <div style={{ fontSize: 13, color: 'var(--text-dim)' }}>{ex.muscle}</div>
            <div style={{ fontFamily: 'var(--serif)', fontStyle: 'italic', fontSize: 36, lineHeight: 1.05, marginTop: 6, letterSpacing: '-0.02em' }}>{ex.name}</div>

            {/* weight + reps */}
            <div style={{ marginTop: 24, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              <div style={{ padding: 18, borderRadius: 20, background: 'var(--surface)', border: '1px solid var(--border)' }}>
                <div style={{ fontSize: 11, color: 'var(--text-muted)', letterSpacing: '0.08em', textTransform: 'uppercase' }}>Peso</div>
                <div style={{ marginTop: 6, display: 'flex', alignItems: 'baseline' }}>
                  <div style={{ fontFamily: 'var(--mono)', fontSize: 40, fontWeight: 500, letterSpacing: '-0.02em' }}>{weights[ex.id]}</div>
                  <div style={{ marginLeft: 4, fontSize: 13, color: 'var(--text-muted)' }}>kg</div>
                </div>
                <div style={{ display: 'flex', gap: 5, marginTop: 12 }}>
                  {[[-2.5,'−2.5'], [-1.25,'−1.25'], [1.25,'+1.25'], [2.5,'+2.5']].map(([d, label]) => (
                    <button key={label} onClick={() => adjWeight(d)} style={{
                      flex: 1, padding: '6px 0', borderRadius: 8, border: 'none',
                      background: d > 0 ? 'var(--accent-dim)' : 'var(--surface-2)',
                      color: d > 0 ? 'var(--accent)' : 'var(--text-dim)',
                      fontFamily: 'var(--mono)', fontSize: 10, fontWeight: 500,
                    }}>{label}</button>
                  ))}
                </div>
              </div>
              <div style={{ padding: 18, borderRadius: 20, background: 'var(--surface)', border: '1px solid var(--border)' }}>
                <div style={{ fontSize: 11, color: 'var(--text-muted)', letterSpacing: '0.08em', textTransform: 'uppercase' }}>Reps</div>
                <div style={{ marginTop: 6, fontFamily: 'var(--mono)', fontSize: 40, fontWeight: 500, letterSpacing: '-0.02em' }}>{ex.reps}</div>
                <div style={{ marginTop: 12, fontSize: 12, color: 'var(--text-dim)', lineHeight: 1.4 }}>objetivo · descanso {ex.restSec}s</div>
              </div>
            </div>

            {/* suggestion */}
            {ex.suggestion === 'subir' && (
              <div style={{ marginTop: 12, padding: '14px 16px', borderRadius: 16, background: 'var(--accent-dim)', border: '1px solid rgba(217,119,87,.22)', display: 'flex', alignItems: 'center', gap: 12 }}>
                <I.ArrowUp sz={18} color="var(--accent)" st={2.2} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, fontWeight: 500 }}>Hace 3 sesiones que mantenés {ex.lastWeight}kg.</div>
                  <div style={{ fontSize: 12, color: 'var(--text-dim)', marginTop: 2 }}>Intentá subir a {ex.lastWeight + 2.5}kg si te sentís fuerte.</div>
                </div>
              </div>
            )}

            {/* set tracker */}
            <div style={{ marginTop: 22 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10 }}>
                <div style={{ fontSize: 13, color: 'var(--text-dim)', fontFamily: 'var(--mono)', letterSpacing: '0.08em', textTransform: 'uppercase' }}>Series</div>
                <div style={{ fontFamily: 'var(--mono)', fontSize: 13, color: 'var(--text)' }}>{dsThis}/{ex.sets}</div>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                {Array.from({ length: ex.sets }).map((_, i) => {
                  const done = i < dsThis, curr = i === dsThis;
                  return (
                    <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 14px', borderRadius: 12, background: curr ? 'var(--accent-dim)' : done ? 'rgba(127,166,122,.07)' : 'var(--surface)', border: `1px solid ${curr ? 'var(--accent)' : done ? 'rgba(127,166,122,.18)' : 'var(--border)'}`, transition: 'all 200ms' }}>
                      <div style={{ width: 26, height: 26, borderRadius: 999, background: done ? 'var(--success)' : curr ? 'var(--accent)' : 'var(--surface-2)', color: done || curr ? '#0e0b0a' : 'var(--text-muted)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'var(--mono)', fontSize: 12, fontWeight: 600 }}>
                        {done ? <I.Check sz={14} st={2.4} /> : i + 1}
                      </div>
                      <div style={{ flex: 1, fontSize: 13.5, color: done ? 'var(--text-dim)' : 'var(--text)' }}>
                        {done ? `${weights[ex.id]} kg · ${ex.reps} reps` : curr ? 'Serie actual' : `${weights[ex.id]} kg · ${ex.reps} reps`}
                      </div>
                      {done && <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--text-muted)' }}>✓</div>}
                    </div>
                  );
                })}
              </div>
            </div>
            <div style={{ height: 90 }} />
          </div>

          {/* bottom actions */}
          <div style={{ padding: '12px 22px 30px', background: 'linear-gradient(180deg,transparent,var(--bg) 40%)', display: 'flex', gap: 8 }}>
            <button onClick={prev} disabled={exIdx === 0} style={navBtn(exIdx === 0)}><I.ChevLeft sz={20} st={2} /></button>
            {dsThis < ex.sets ? (
              <Button size="lg" onClick={completeSet} icon={<I.Check sz={18} st={2.2} />} style={{ flex: 1 }}>Serie hecha</Button>
            ) : (
              <Button size="lg" onClick={next} icon={<I.ChevRight sz={18} />} style={{ flex: 1 }}>
                {exIdx < totalEx - 1 ? 'Siguiente ejercicio' : 'Terminar'}
              </Button>
            )}
            <button onClick={next} style={navBtn(false)}><I.ChevRight sz={20} st={2} /></button>
          </div>

          {/* rest timer */}
          {timer && timer.secondsLeft > 0 && <RestTimer timer={timer} onSkip={() => setTimer(null)} onAdd={s => setTimer(t => t ? { ...t, secondsLeft: t.secondsLeft + s, total: t.total + s } : null)} />}
        </div>
      );
    }

    const navBtn = disabled => ({
      width: 56, height: 56, borderRadius: 18, background: 'var(--surface)', border: '1px solid var(--border)', color: 'var(--text-dim)', display: 'flex', alignItems: 'center', justifyContent: 'center', opacity: disabled ? 0.4 : 1, cursor: disabled ? 'not-allowed' : 'pointer',
    });
    const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

    function RestTimer({ timer, onSkip, onAdd }) {
      const pct = 1 - timer.secondsLeft / timer.total;
      const m = Math.floor(timer.secondsLeft / 60), s = timer.secondsLeft % 60;
      return (
        <div style={{ position: 'absolute', left: 16, right: 16, bottom: 110, background: 'rgba(34,29,26,.92)', backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)', border: '1px solid rgba(217,119,87,.35)', borderRadius: 22, padding: '14px 18px', display: 'flex', alignItems: 'center', gap: 14, boxShadow: '0 20px 50px rgba(0,0,0,.5)', animation: 'scale-in 320ms cubic-bezier(.2,.7,.2,1) both', zIndex: 50 }}>
          <CircleProgress size={62} stroke={5} value={pct} max={1}>
            <div style={{ fontFamily: 'var(--mono)', fontSize: 16, color: 'var(--text)', fontWeight: 500 }}>{String(m).padStart(2,'0')}:{String(s).padStart(2,'0')}</div>
          </CircleProgress>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 11, color: 'var(--accent)', fontFamily: 'var(--mono)', letterSpacing: '0.08em', textTransform: 'uppercase' }}>Descanso</div>
            <div style={{ marginTop: 2, fontSize: 14, color: 'var(--text)', lineHeight: 1.3 }}>Preparate para la siguiente.</div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            <button onClick={() => onAdd(15)} style={{ padding: '5px 10px', borderRadius: 10, background: 'var(--surface-2)', border: 'none', color: 'var(--text-dim)', fontFamily: 'var(--mono)', fontSize: 11, cursor: 'pointer' }}>+15s</button>
            <button onClick={onSkip} style={{ padding: '5px 10px', borderRadius: 10, background: 'var(--accent)', border: 'none', color: '#1a0f0a', fontFamily: 'var(--sans)', fontSize: 11, fontWeight: 500, cursor: 'pointer' }}>Saltar</button>
          </div>
        </div>
      );
    }

    function TrainingDone({ elapsed, setsDone, onExit }) {
      return (
        <div style={{ position: 'absolute', inset: 0, background: 'var(--bg)', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', padding: '100px 24px 48px' }}>
          <div style={{ animation: 'float-up 600ms cubic-bezier(.2,.7,.2,1) both' }}>
            <div style={{ position: 'relative', width: 96, height: 96, marginBottom: 24 }}>
              <div style={{ position: 'absolute', inset: 0, borderRadius: 999, background: 'var(--accent-dim)', animation: 'pulse-ring 2.4s ease-out infinite' }} />
              <div style={{ position: 'absolute', inset: 0, borderRadius: 999, background: 'linear-gradient(160deg,var(--accent),#b85a3e)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 50, boxShadow: '0 12px 40px rgba(217,119,87,.35)' }}>🎉</div>
            </div>
            <div style={{ fontFamily: 'var(--serif)', fontStyle: 'italic', fontSize: 40, lineHeight: 1.05, letterSpacing: '-0.02em', marginBottom: 12 }}>Bien hecho.</div>
            <div style={{ color: 'var(--text-dim)', fontSize: 15, lineHeight: 1.5, marginBottom: 28 }}>Cerraste tu sesión de piernas. Mañana toca descanso, recuperate bien.</div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              {[['Tiempo', fmt(elapsed), true], ['Series', `${setsDone}/${ROUTINE_TODAY.totalSets}`, true], ['kcal aprox.', '~ 412', true], ['PRs', '1 nuevo', false]].map(([l, v, mono]) => (
                <div key={l} style={{ padding: '14px 16px', borderRadius: 16, background: 'var(--surface)', border: '1px solid var(--border)' }}>
                  <div style={{ fontSize: 11, color: 'var(--text-muted)', letterSpacing: '0.08em', textTransform: 'uppercase' }}>{l}</div>
                  <div style={{ marginTop: 6, fontSize: 22, fontWeight: 500, fontFamily: mono ? 'var(--mono)' : 'var(--sans)', letterSpacing: '-0.01em' }}>{v}</div>
                </div>
              ))}
            </div>
          </div>
          <Button size="lg" onClick={onExit} style={{ width: '100%' }}>Cerrar sesión</Button>
        </div>
      );
    }

    /* ─────────────────────────────────────────────────────────────
       ALIMENTACIÓN TAB
    ───────────────────────────────────────────────────────────── */
    function AlimentacionTab() {
      const [openBlock, setOpenBlock] = useState(null);
      const [selected,  setSelected]  = useState({});

      if (openBlock) {
        const block = MEAL_PLAN.blocks.find(b => b.key === openBlock);
        return (
          <MealDetail block={block} selectedIdx={selected[openBlock] ?? null}
            onClose={() => setOpenBlock(null)}
            onSelect={i => { setSelected(s => ({ ...s, [openBlock]: i })); setOpenBlock(null); }}
          />
        );
      }

      const totalKcal = Object.entries(selected).reduce((acc, [k, i]) => {
        const b = MEAL_PLAN.blocks.find(x => x.key === k);
        return acc + (b?.options[i]?.kcal || 0);
      }, 0);
      const totalP = Object.entries(selected).reduce((acc, [k, i]) => {
        const b = MEAL_PLAN.blocks.find(x => x.key === k);
        return acc + (b?.options[i]?.p || 0);
      }, 0);
      const totalC = Object.entries(selected).reduce((acc, [k, i]) => {
        const b = MEAL_PLAN.blocks.find(x => x.key === k);
        return acc + (b?.options[i]?.c || 0);
      }, 0);
      const totalF = Object.entries(selected).reduce((acc, [k, i]) => {
        const b = MEAL_PLAN.blocks.find(x => x.key === k);
        return acc + (b?.options[i]?.f || 0);
      }, 0);

      return (
        <Screen>
          <div>
            <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--text-muted)', letterSpacing: '0.14em', textTransform: 'uppercase' }}>Plan de comidas</div>
            <div style={{ fontFamily: 'var(--serif)', fontStyle: 'italic', fontSize: 34, letterSpacing: '-0.02em', lineHeight: 1.1, marginTop: 6 }}>Alimentación</div>
          </div>

          {/* daily summary */}
          <Card style={{ marginTop: 22, padding: 22 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
              <CircleProgress size={104} stroke={9} value={totalKcal} max={MEAL_PLAN.macros.kcal}>
                <div style={{ fontFamily: 'var(--mono)', fontSize: 20, fontWeight: 500 }}>{totalKcal}</div>
                <div style={{ fontSize: 10, color: 'var(--text-muted)', marginTop: 1 }}>de {MEAL_PLAN.macros.kcal}</div>
              </CircleProgress>
              <div style={{ flex: 1, minWidth: 0 }}>
                <Chip tone="accent" icon={<I.Target sz={11} />}>Recomposición</Chip>
                <div style={{ marginTop: 10, display: 'flex', flexDirection: 'column', gap: 7 }}>
                  <MacroBar label="Proteínas"     value={totalP} max={MEAL_PLAN.macros.p} unit="g" accent />
                  <MacroBar label="Carbohidratos" value={totalC} max={MEAL_PLAN.macros.c} unit="g" />
                  <MacroBar label="Grasas"        value={totalF} max={MEAL_PLAN.macros.f} unit="g" />
                </div>
              </div>
            </div>
          </Card>

          {/* meal blocks */}
          <div style={{ marginTop: 26 }}>
            <SectionTitle eyebrow="Hoy" action={<button style={{ background:'transparent', border:'none', color:'var(--accent)', fontSize:13, cursor:'pointer', fontFamily:'var(--sans)' }}>Editar plan</button>}>Tus comidas</SectionTitle>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {MEAL_PLAN.blocks.map(b => {
                const idx = selected[b.key];
                const picked = idx != null ? b.options[idx] : null;
                return (
                  <Card key={b.key} onClick={() => setOpenBlock(b.key)} style={{ padding: 0 }}>
                    <div style={{ padding: '18px 18px 14px' }}>
                      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 12 }}>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                            <div style={{ fontSize: 15.5, fontWeight: 500 }}>{b.title}</div>
                            {picked && <Chip tone="success" size="sm" icon={<I.Check sz={10} st={2.4} />}>Elegido</Chip>}
                          </div>
                          <div style={{ marginTop: 4, fontSize: 12.5, color: 'var(--text-dim)' }}>{b.subtitle}</div>
                        </div>
                        <I.ChevRight sz={16} color="var(--text-muted)" />
                      </div>
                      {/* option chips */}
                      <div style={{ marginTop: 14, display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                        {b.options.map((o, i) => {
                          const on = idx === i;
                          return (
                            <div key={i} style={{ padding: '6px 10px', borderRadius: 999, background: on ? 'var(--accent)' : 'var(--surface-2)', color: on ? '#1a0f0a' : 'var(--text-dim)', fontSize: 11.5, fontWeight: 500, whiteSpace: 'nowrap', maxWidth: 160, overflow: 'hidden', textOverflow: 'ellipsis' }}>
                              {o.name}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </Card>
                );
              })}
            </div>
          </div>

          {/* AI suggestion */}
          <div style={{ marginTop: 22, padding: 18, borderRadius: 18, background: 'var(--surface)', border: '1px dashed var(--border-strong)' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
              <div style={{ width: 32, height: 32, borderRadius: 10, background: 'var(--accent-dim)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <I.Sparkle sz={16} color="var(--accent)" />
              </div>
              <div style={{ fontSize: 14, fontWeight: 500 }}>Generar nuevo plan</div>
            </div>
            <div style={{ fontSize: 12.5, color: 'var(--text-dim)', lineHeight: 1.5 }}>Cambiá las kcal, agregá restricciones (sin gluten, vegetariano…) o subí tu plan actual.</div>
            <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
              <Button size="sm" variant="soft" icon={<I.Sparkle sz={13} />}>Generar</Button>
              <Button size="sm" variant="ghost" icon={<I.Plus sz={13} st={2} />}>Cargar mío</Button>
            </div>
          </div>
        </Screen>
      );
    }

    function MacroBar({ label, value, max, unit, accent }) {
      const pct = Math.min(1, (value || 0) / max);
      return (
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, marginBottom: 3 }}>
            <span style={{ color: 'var(--text-muted)' }}>{label}</span>
            <span style={{ fontFamily: 'var(--mono)', color: 'var(--text-dim)' }}>{Math.round(value || 0)}/{max}{unit}</span>
          </div>
          <div style={{ height: 4, borderRadius: 999, background: 'var(--surface-2)', overflow: 'hidden' }}>
            <div style={{ width: `${pct * 100}%`, height: '100%', borderRadius: 999, background: accent ? 'var(--accent)' : 'rgba(240,235,229,.55)', transition: 'width 600ms cubic-bezier(.2,.7,.2,1)' }} />
          </div>
        </div>
      );
    }

    function MealDetail({ block, selectedIdx, onClose, onSelect }) {
      return (
        <div style={{ position: 'absolute', inset: 0, background: 'var(--bg)', display: 'flex', flexDirection: 'column', animation: 'fade-in 280ms ease both', zIndex: 30 }}>
          <div style={{ height: 56 }} />
          <div style={{ padding: '6px 22px 18px', display: 'flex', alignItems: 'center', gap: 12 }}>
            <button onClick={onClose} style={{ width: 34, height: 34, borderRadius: 999, background: 'var(--surface)', border: '1px solid var(--border)', color: 'var(--text-dim)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <I.ChevLeft sz={18} st={1.8} />
            </button>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: 'var(--mono)', fontSize: 10.5, color: 'var(--text-muted)', letterSpacing: '0.14em', textTransform: 'uppercase' }}>Opciones</div>
              <div style={{ fontSize: 19, fontWeight: 500, marginTop: 2 }}>{block.title}</div>
            </div>
          </div>
          <div style={{ flex: 1, overflowY: 'auto', padding: '0 22px 24px', WebkitOverflowScrolling: 'touch' }}>
            <div style={{ fontSize: 13, color: 'var(--text-dim)', marginBottom: 18 }}>Tocá una opción para fijarla hoy. Las cuatro están dentro de tu plan.</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {block.options.map((o, i) => {
                const on = selectedIdx === i;
                return (
                  <button key={i} onClick={() => onSelect(i)} style={{ padding: 18, borderRadius: 18, textAlign: 'left', cursor: 'pointer', background: on ? 'var(--accent-dim)' : 'var(--surface)', border: `1px solid ${on ? 'var(--accent)' : 'var(--border)'}`, color: 'var(--text)', fontFamily: 'var(--sans)', transition: 'all 180ms', width: '100%' }}>
                    <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 10 }}>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 15.5, fontWeight: 500 }}>{o.name}</div>
                        <div style={{ marginTop: 4, fontSize: 12.5, color: 'var(--text-dim)', lineHeight: 1.5 }}>{o.desc}</div>
                      </div>
                      <div style={{ flexShrink: 0, textAlign: 'right' }}>
                        <div style={{ fontFamily: 'var(--mono)', fontSize: 17, fontWeight: 500 }}>{o.kcal}</div>
                        <div style={{ fontSize: 10.5, color: 'var(--text-muted)' }}>kcal</div>
                      </div>
                    </div>
                    <div style={{ marginTop: 14, display: 'flex', gap: 14, alignItems: 'center' }}>
                      {[['P', o.p], ['C', o.c], ['G', o.f]].map(([t, v]) => (
                        <div key={t} style={{ display: 'flex', alignItems: 'baseline', gap: 3 }}>
                          <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-muted)', letterSpacing: '0.08em' }}>{t}</span>
                          <span style={{ fontFamily: 'var(--mono)', fontSize: 12.5, color: 'var(--text-dim)' }}>{v}g</span>
                        </div>
                      ))}
                      <div style={{ flex: 1 }} />
                      {on && <Chip tone="accent" size="sm" icon={<I.Check sz={10} st={2.4} />}>Elegido</Chip>}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    /* ─────────────────────────────────────────────────────────────
       PROGRESO TAB
    ───────────────────────────────────────────────────────────── */
    function ProgresoTab() {
      return (
        <Screen>
          <div>
            <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--text-muted)', letterSpacing: '0.14em', textTransform: 'uppercase' }}>Seguimiento</div>
            <div style={{ fontFamily: 'var(--serif)', fontStyle: 'italic', fontSize: 34, letterSpacing: '-0.02em', lineHeight: 1.1, marginTop: 6 }}>Tu progreso</div>
          </div>

          {/* hero card */}
          <Card accent style={{ marginTop: 22, padding: 22 }}>
            <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between' }}>
              <div>
                <Chip tone="accent" icon={<I.Flame sz={11} />}>{PROGRESS.streak} días seguidos</Chip>
                <div style={{ marginTop: 14, display: 'flex', alignItems: 'baseline', gap: 6 }}>
                  <div style={{ fontFamily: 'var(--mono)', fontSize: 44, fontWeight: 500, letterSpacing: '-0.02em' }}>{PROGRESS.weight.current}</div>
                  <div style={{ fontSize: 14, color: 'var(--text-muted)' }}>kg</div>
                </div>
                <div style={{ marginTop: 4, fontSize: 12.5, color: 'var(--success)', display: 'flex', alignItems: 'center', gap: 4 }}>
                  <I.ArrowDown sz={12} st={2.2} />{Math.abs(PROGRESS.weight.delta)} kg en 5 semanas
                </div>
              </div>
              <CircleProgress size={80} stroke={7}
                value={PROGRESS.weight.series[0].v - PROGRESS.weight.current}
                max={PROGRESS.weight.series[0].v - PROGRESS.weight.target}>
                <div style={{ fontFamily: 'var(--mono)', fontSize: 14, fontWeight: 500 }}>{PROGRESS.weight.target}</div>
                <div style={{ fontSize: 9, color: 'var(--text-muted)', marginTop: 1 }}>meta</div>
              </CircleProgress>
            </div>
            {/* chart */}
            <div style={{ marginTop: 20 }}>
              <SmoothLine data={PROGRESS.weight.series} height={120} />
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-muted)', marginTop: 6 }}>
              {PROGRESS.weight.series.map((p, i) => <span key={i}>{p.d.split(' ')[0]}</span>)}
            </div>
          </Card>

          {/* week activity */}
          <div style={{ marginTop: 26 }}>
            <SectionTitle eyebrow="Actividad semanal" action={
              <span style={{ fontFamily: 'var(--mono)', fontSize: 11.5, color: 'var(--text-dim)' }}>
                {PROGRESS.weekActivity.reduce((a,d) => a + d.mins, 0)} min
              </span>
            }>3 sesiones</SectionTitle>
            <Card style={{ padding: 18 }}>
              <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 6, height: 90 }}>
                {PROGRESS.weekActivity.map((d, i) => {
                  const maxM = Math.max(...PROGRESS.weekActivity.map(x => x.mins), 1);
                  const h = d.mins === 0 ? 8 : 14 + (d.mins / maxM) * 70;
                  return (
                    <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
                      <div style={{ width: '100%', height: h, borderRadius: 8, background: d.mins > 0 ? 'var(--accent)' : 'var(--surface-2)', opacity: d.mins > 0 ? 1 : 0.5, transition: 'all 600ms' }} />
                      <div style={{ fontFamily: 'var(--mono)', fontSize: 10.5, color: d.mins > 0 ? 'var(--text-dim)' : 'var(--text-muted)' }}>{d.day}</div>
                    </div>
                  );
                })}
              </div>
            </Card>
          </div>

          {/* month stats */}
          <div style={{ marginTop: 26 }}>
            <SectionTitle eyebrow="Este mes">Resumen</SectionTitle>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              {[
                { label: 'Sesiones',  value: `${PROGRESS.thisMonth.sessions}`, sub: `de ${PROGRESS.thisMonth.target}`, Icon: I.Bolt },
                { label: 'Horas',     value: `${PROGRESS.thisMonth.hours}`,    sub: 'entrenando',                      Icon: I.Timer },
                { label: 'Calorías',  value: `${(PROGRESS.thisMonth.kcal/1000).toFixed(1)}k`, sub: 'quemadas',        Icon: I.Flame },
                { label: 'PRs',       value: `${PROGRESS.prs.length}`,         sub: 'nuevos',                          Icon: I.Trophy },
              ].map(({ label, value, sub, Icon }) => (
                <div key={label} style={{ padding: '14px 16px', borderRadius: 16, background: 'var(--surface)', border: '1px solid var(--border)' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <Icon sz={14} color="var(--accent)" />
                    <div style={{ fontSize: 11, color: 'var(--text-muted)', letterSpacing: '0.08em', textTransform: 'uppercase' }}>{label}</div>
                  </div>
                  <div style={{ marginTop: 8, fontFamily: 'var(--mono)', fontSize: 24, fontWeight: 500, letterSpacing: '-0.01em' }}>{value}</div>
                  <div style={{ fontSize: 11.5, color: 'var(--text-muted)', marginTop: 2 }}>{sub}</div>
                </div>
              ))}
            </div>
          </div>

          {/* PRs */}
          <div style={{ marginTop: 26 }}>
            <SectionTitle eyebrow="Récords" action={<button style={{ background:'transparent', border:'none', color:'var(--accent)', fontSize:13, cursor:'pointer', fontFamily:'var(--sans)' }}>Ver todo</button>}>Nuevos PRs</SectionTitle>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {PROGRESS.prs.map((p, i) => (
                <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '14px 16px', borderRadius: 16, background: 'var(--surface)', border: '1px solid var(--border)' }}>
                  <div style={{ width: 36, height: 36, borderRadius: 10, background: 'var(--accent-dim)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--accent)' }}>
                    <I.Trophy sz={17} />
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 14, fontWeight: 500 }}>{p.lift}</div>
                    <div style={{ marginTop: 2, fontSize: 12, color: 'var(--text-muted)' }}>{p.when}</div>
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    <div style={{ fontFamily: 'var(--mono)', fontSize: 15, fontWeight: 500 }}>{p.weight}<span style={{ fontSize: 10.5, color: 'var(--text-muted)', marginLeft: 2 }}>kg</span></div>
                    <div style={{ fontSize: 10.5, color: 'var(--success)', marginTop: 2, fontFamily: 'var(--mono)' }}>{p.delta}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* coach note */}
          <div style={{ marginTop: 22, padding: 18, borderRadius: 18, background: 'linear-gradient(160deg,rgba(217,119,87,.10),rgba(217,119,87,.02) 60%) var(--surface)', border: '1px solid rgba(217,119,87,.18)' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
              <div style={{ width: 32, height: 32, borderRadius: 999, background: 'var(--accent)', color: '#1a0f0a', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16 }}>🏋️</div>
              <div>
                <div style={{ fontSize: 13.5, fontWeight: 500 }}>Pulso · tu coach</div>
                <div style={{ fontSize: 10.5, color: 'var(--text-muted)', fontFamily: 'var(--mono)', letterSpacing: '0.08em' }}>HOY</div>
              </div>
            </div>
            <div style={{ fontSize: 14, color: 'var(--text)', lineHeight: 1.55 }}>
              Llevás 3 sesiones manteniendo el peso en sentadilla. Hoy es el momento de subir 2,5 kg.
            </div>
          </div>
        </Screen>
      );
    }

    /* ─────────────────────────────────────────────────────────────
       ROOT APP
    ───────────────────────────────────────────────────────────── */
    const TABS = [
      { id: 'rutina',   label: 'Rutina',    icon: I.Dumbbell },
      { id: 'comida',   label: 'Comida',    icon: I.Apple    },
      { id: 'progreso', label: 'Progreso',  icon: I.Chart    },
    ];

    function App() {
      const [phase,    setPhase]    = useState('onboarding'); // onboarding | welcome | app
      const [user,     setUser]     = useState({});
      const [tab,      setTab]      = useState('rutina');
      const [training, setTraining] = useState(null);

      return (
        <div className="pulso-app">
          {/* app content */}
          {phase === 'onboarding' && <Onboarding onFinish={u => { setUser(u); setPhase('welcome'); }} />}
          {phase === 'welcome'    && <WelcomeAnim name={user.name} onDone={() => setPhase('app')} />}
          {phase === 'app' && (
            <>
              {tab === 'rutina'   && <RutinaTab    training={training} setTraining={setTraining} />}
              {tab === 'comida'   && <AlimentacionTab />}
              {tab === 'progreso' && <ProgresoTab />}
              {!training && <TabBar tabs={TABS} active={tab} onChange={setTab} />}
            </>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./pulso-sw.js')
          .catch(() => {/* silently fails when opened as local file */});
      });
    }
  </script>
</body>
</html>
